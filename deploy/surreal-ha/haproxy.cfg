# One address for Brain (SURREALDB_URL=ws://surreal:8000), two SurrealDB
# compute nodes behind it. A WebSocket is a long-lived TCP stream, so TCP
# mode; a node that fails /health leaves the pool and Brain's client
# reconnects to the one left.
global
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h

frontend surreal
  bind *:8000
  default_backend surreal_nodes

backend surreal_nodes
  balance leastconn
  option httpchk GET /health
  http-check expect status 200
  default-server inter 2s fall 2 rise 2
  server surreal-a surreal-a:8000 check
  server surreal-b surreal-b:8000 check
