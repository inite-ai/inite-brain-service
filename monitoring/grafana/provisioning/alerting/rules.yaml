# Grafana-managed alert rules. Always provisioned; where notifications
# land depends on whether telegram.yaml was deployed alongside (see
# grafana/alerting-optional/ and the deploy workflow) — without it the
# rules still evaluate and show state in the Alerting UI.
#
# Pattern per rule: refId A = PromQL against VictoriaMetrics (uid vm),
# refId C = threshold expression. Comparisons live in the threshold, not
# in the PromQL — `expr == 0` returns an EMPTY set on healthy, which
# Grafana reads as NoData, not OK.
apiVersion: 1

groups:
  - orgId: 1
    name: brain
    folder: Brain
    interval: 1m
    rules:
      - uid: brain-scrape-down
        title: BrainScrapeDown
        condition: C
        for: 3m
        noDataState: Alerting # series gone = collector or brain gone
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: brain /metrics scrape is failing (target down or unreachable)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: up{job="brain"}
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # BrainScrapeDown fires when a target that IS discovered stops
      # answering. It cannot see a replica that disappears from discovery
      # altogether: the query still returns the survivors' series, all of
      # them 1. This rule watches the COUNT instead — how many brain
      # replicas are exporting now against the most this host has run in
      # the last six hours — so "one of three quietly went away" is an
      # alert rather than a slightly quieter dashboard. `for: 15m` rides
      # out a rolling recreate, which briefly runs fewer containers.
      - uid: brain-replica-missing
        title: BrainReplicaMissing
        condition: C
        for: 15m
        noDataState: OK # nothing exporting at all is BrainScrapeDown's job
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: fewer brain replicas are exporting metrics than this host was running (a replica stopped or vanished from discovery)
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: count(up{job="brain"} == 1) / clamp_min(max_over_time(count(up{job="brain"} == 1)[6h:1m]), 1)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: brain-policy-resolution-errors
        title: PolicyResolutionErrors
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: a key referenced an unknown policy set (failed closed — some key is bricked)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: increase(brain_policy_resolution_errors_total[10m])
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: brain-migration-blocked
        title: MigrationBlocked
        condition: C
        for: 5m
        noDataState: OK # scrape-down alert covers series absence
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: a tenant's next migration fails to apply — Brain refuses that tenant's reads, writes and jobs until it does (label migration names the file; logs say why)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: sum(brain_migration_blocked) or vector(0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: brain-no-worker-leader
        title: NoWorkerLeader
        condition: C
        for: 10m
        noDataState: OK # scrape-down alert covers series absence
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: no pod holds the worker_loop lease — background jobs (dreams/compaction/sweeper) are not running
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: sum(brain_worker_is_leader) or vector(0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: brain-job-failure-ratio
        title: JobFailureRatioHigh
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: '>20% of background jobs failed over the last 15m'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: sum(increase(brain_job_total{outcome="failed"}[15m])) / clamp_min(sum(increase(brain_job_total[15m])), 1)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }

      # max(), not sum() and not a bare series: the consumer runs only on
      # the replica holding the changefeed_consumer lease, so exactly one
      # instance reports a measurement and the others report nothing at
      # all (MetricsService drops the boot zero for lease-only gauges, so
      # a non-leader cannot contribute an invented 0 here).
      - uid: brain-changefeed-lag
        title: ChangefeedLagSustained
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: CHANGEFEED consumer is falling behind (audit_event ingestion lag)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: max(brain_changefeed_lag_records)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [500] }

      - uid: brain-openai-error-ratio
        title: OpenAIErrorRatioHigh
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: '>15% of OpenAI calls errored over the last 15m (upstream flaky or key/quota trouble)'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: sum(increase(brain_openai_calls_total{outcome!="ok"}[15m])) / clamp_min(sum(increase(brain_openai_calls_total[15m])), 1)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.15] }

      # The 2026-11-13 incident (#945): the provider account answered
      # 402 for hours while the error ratio above stayed under its bar
      # (most calls were cheap and still served). Billing and key failures
      # never heal by waiting, so any of them pages.
      - uid: brain-provider-billing-or-key
        title: ProviderBillingOrKeyFailing
        condition: C
        for: 0s
        noDataState: OK # scrape-down alert covers series absence
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: a model provider refused calls for billing (402 / exhausted credit) or key (401/403) reasons in the last 10m — top up or rotate the key; label capability says embed or chat (docs/operations.md § Server model provider health)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: sum(increase(brain_provider_failures_total{class=~"billing|key"}[10m])) or vector(0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # ── Capability probes ────────────────────────────────────────────
      # The active counterpart to /ready. Readiness is polled at DEPLOY
      # time; the scoped pool that went anonymous ~59 minutes after boot
      # (#502) was invisible to it by construction. These three rules read
      # the series a timer writes by actually RUNNING each capability.
      #
      # A busy pool never reaches any of them: `brain_capability_probe_ok`
      # is written only on a CONCLUSIVE outcome, so saturation leaves the
      # gauge where it was — the same call #502 made in readiness.
      - uid: brain-capability-scoped-read-dead
        title: ScopedReadCapabilityDead
        condition: C
        # 5m = five consecutive conclusive failures at the 60s default
        # cadence. This failure is STICKY (a lapsed session stays lapsed
        # until the process restarts), so waiting costs almost nothing and
        # buys immunity from a single-tick blip — a DB restart, a rolling
        # deploy, one dropped websocket. The alternative baseline is not
        # "faster", it is the 6-day and forever-until-a-user-reported-it
        # detection the last two incidents actually got.
        for: 5m
        # No series = the probe is off or the pod is still booting; a dead
        # target is BrainScrapeDown's job, not this rule's.
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: >-
            a pod's caller-facing read path cannot authorize — every search / entity / fact read is
            failing there while /health stays green. Which pod: the `instance` label. Which tenant:
            all of them (one scoped session serves the whole pod). Runbook: docs/operations.md §
            Capability probes
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              # min across pods: ONE bad pod is a real outage for the share
              # of traffic it serves, and the session lapses per-process.
              expr: min(brain_capability_probe_ok{capability="scoped_read"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # Catch-all for every OTHER capability, so the next one added gets an
      # alert without anyone remembering to write one. Deliberately excludes
      # scoped_read (covered above at 5m) to avoid double-paging, and runs a
      # long window because the capability it covers today — embed — is 0
      # during a legitimate cold bge-m3 warmup (~340MB ONNX pull). 20m is
      # comfortably past a slow warmup and far short of a shift.
      - uid: brain-capability-probe-failing
        title: CapabilityProbeFailing
        condition: C
        for: 20m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: >-
            capability {{ $labels.capability }} has been failing its probe for 20m — it is alive
            but not serving correctly (unauthorized, or answering outside the configured embedding
            space). Runbook: docs/operations.md § Capability probes
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: min by (capability) (brain_capability_probe_ok{capability!="scoped_read"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # The up-gauge cannot see a prober that is itself wedged (it would sit
      # at its last value forever) or a pool that has been nothing but BUSY
      # — the two states where "green" means "unmeasured". 30m of no
      # confirmed serve is a warning, never a page: sustained saturation is
      # a capacity problem, and paging on it would punish the pods that are
      # still taking traffic.
      - uid: brain-capability-probe-stale
        title: CapabilityProbeStale
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: >-
            capability {{ $labels.capability }} has not been confirmed serving for 30m — the probe
            is wedged, the pool has been saturated that whole time, or it has never once
            succeeded since this pod armed it. Check
            brain_capability_probe_total{outcome="busy"} to tell saturation from the rest
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: vm
            # `or … armed_timestamp` is what makes "never succeeded" visible.
            # Measuring age against last_success ALONE meant a capability that
            # had never once served produced no series, the expression
            # returned no data, and noDataState: OK swallowed it — so the one
            # case this alert most needed to catch (broken from the first
            # tick) was the one case it could not. Falling back to the
            # armed-at series measures age from arming instead, so "never
            # worked" reads as a large age rather than as absence. Arming
            # time rather than now() keeps a legitimately slow first success
            # — a cold model warmup — inside the same 30m budget instead of
            # paging immediately.
            model:
              refId: A
              expr: >-
                time() - min by (capability) (
                  brain_capability_probe_last_success_timestamp_seconds
                  or brain_capability_probe_armed_timestamp_seconds
                )
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1800] }

      - uid: host-disk-low
        title: HostDiskLow
        condition: C
        for: 10m
        noDataState: Alerting # losing disk visibility is itself a page
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: droplet root filesystem has <10% free space
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: min(node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.10] }

      - uid: host-mem-low
        title: HostMemLow
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: droplet has <8% RAM available
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.08] }

      # ── SLOs (docs/slo.md) ────────────────────────────────────────────
      # Multi-window, multi-burn-rate alerts (Google SRE Workbook, ch. 5,
      # table 5-8) over a 30-day window. Each expression is the MIN of the
      # long- and short-window burn rates, so it crosses the threshold only
      # while both do: the long window proves the budget is really going,
      # the short one that it still is (fast reset after a fix). Burn rate
      # = observed bad ratio / allowed bad ratio. The terms carry distinct
      # labels (label_replace) because `or` would drop same-label series.

      - uid: brain-availability-slo-fast-burn
        title: AvailabilitySLOFastBurn
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          slo: 'availability'
        annotations:
          summary: 'Availability error budget burning 14.4x (2% of the 30-day budget in 1h): 5xx + MCP internal errors'
          runbook_url: 'https://github.com/inite-ai/inite-brain-service/blob/main/docs/slo.md'
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: >-
                min(label_replace((((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[1h])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[1h])) or vector(0))) / clamp_min(sum(increase(brain_http_requests_total{route!~"/(health|ready|metrics).*"}[1h])), 1)) / 0.005, "w", "long", "", "") or label_replace((((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[5m])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[5m])) or vector(0))) / clamp_min(sum(increase(brain_http_requests_total{route!~"/(health|ready|metrics).*"}[5m])), 1)) / 0.005, "w", "short", "", "") or label_replace(((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[1h])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[1h])) or vector(0))) * 14.4 / 5, "w", "events", "", ""))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [14.4] }

      - uid: brain-availability-slo-slow-burn
        title: AvailabilitySLOSlowBurn
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          slo: 'availability'
        annotations:
          summary: 'Availability error budget burning 6x (5% of the 30-day budget in 6h)'
          runbook_url: 'https://github.com/inite-ai/inite-brain-service/blob/main/docs/slo.md'
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: >-
                min(label_replace((((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[6h])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[6h])) or vector(0))) / clamp_min(sum(increase(brain_http_requests_total{route!~"/(health|ready|metrics).*"}[6h])), 1)) / 0.005, "w", "long", "", "") or label_replace((((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[30m])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[30m])) or vector(0))) / clamp_min(sum(increase(brain_http_requests_total{route!~"/(health|ready|metrics).*"}[30m])), 1)) / 0.005, "w", "short", "", "") or label_replace(((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[6h])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[6h])) or vector(0))) * 6 / 10, "w", "events", "", ""))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [6] }

      - uid: brain-availability-slo-budget-drain
        title: AvailabilitySLOBudgetDrain
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          slo: 'availability'
        annotations:
          summary: 'Availability error budget burning faster than it refills (1x over 3d): the 30-day SLO will be missed at this rate'
          runbook_url: 'https://github.com/inite-ai/inite-brain-service/blob/main/docs/slo.md'
        data:
          - refId: A
            relativeTimeRange: { from: 259200, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: >-
                min(label_replace((((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[3d])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[3d])) or vector(0))) / clamp_min(sum(increase(brain_http_requests_total{route!~"/(health|ready|metrics).*"}[3d])), 1)) / 0.005, "w", "long", "", "") or label_replace((((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[6h])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[6h])) or vector(0))) / clamp_min(sum(increase(brain_http_requests_total{route!~"/(health|ready|metrics).*"}[6h])), 1)) / 0.005, "w", "short", "", "") or label_replace(((sum(increase(brain_http_requests_total{status_class="5xx",route!~"/(health|ready|metrics).*"}[3d])) or vector(0)) + (sum(increase(brain_mcp_tool_calls_total{outcome="internal_error"}[3d])) or vector(0))) * 1 / 20, "w", "events", "", ""))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: brain-latency-slo-rest-burn
        title: LatencySLORestBurn
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          slo: 'latency'
        annotations:
          summary: 'REST latency budget burning 6x: more than 30% of interactive requests slower than 5s over 6h and 30m'
          runbook_url: 'https://github.com/inite-ai/inite-brain-service/blob/main/docs/slo.md'
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: >-
                min(label_replace(((1 - sum(increase(brain_http_request_duration_seconds_bucket{le="5",route!~"/(health|ready|metrics).*|/mcp.*|/v1/synthesize.*|/v1/search/multi-hop.*|/v1/answer.*|/v1/documents.*|/v1/admin.*|/v1/live.*|/v1/source-connections.*"}[6h])) / clamp_min(sum(increase(brain_http_request_duration_seconds_count{route!~"/(health|ready|metrics).*|/mcp.*|/v1/synthesize.*|/v1/search/multi-hop.*|/v1/answer.*|/v1/documents.*|/v1/admin.*|/v1/live.*|/v1/source-connections.*"}[6h])), 1)) / 0.05), "w", "long", "", "") or label_replace(((1 - sum(increase(brain_http_request_duration_seconds_bucket{le="5",route!~"/(health|ready|metrics).*|/mcp.*|/v1/synthesize.*|/v1/search/multi-hop.*|/v1/answer.*|/v1/documents.*|/v1/admin.*|/v1/live.*|/v1/source-connections.*"}[30m])) / clamp_min(sum(increase(brain_http_request_duration_seconds_count{route!~"/(health|ready|metrics).*|/mcp.*|/v1/synthesize.*|/v1/search/multi-hop.*|/v1/answer.*|/v1/documents.*|/v1/admin.*|/v1/live.*|/v1/source-connections.*"}[30m])), 1)) / 0.05), "w", "short", "", ""))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [6] }

      - uid: brain-latency-slo-mcp-burn
        title: LatencySLOMcpBurn
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          slo: 'latency'
        annotations:
          summary: 'MCP tool latency budget burning 6x: more than 30% of interactive tool calls slower than 5s over 6h and 30m'
          runbook_url: 'https://github.com/inite-ai/inite-brain-service/blob/main/docs/slo.md'
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: vm
            model:
              refId: A
              expr: >-
                min(label_replace(((1 - sum(increase(brain_mcp_tool_duration_seconds_bucket{le="5",tool!~"synthesize|search_multi_hop|agent_qa|summarize_entity|detect_contradiction|why|ingest_document|submit_memory_work|other"}[6h])) / clamp_min(sum(increase(brain_mcp_tool_duration_seconds_count{tool!~"synthesize|search_multi_hop|agent_qa|summarize_entity|detect_contradiction|why|ingest_document|submit_memory_work|other"}[6h])), 1)) / 0.05), "w", "long", "", "") or label_replace(((1 - sum(increase(brain_mcp_tool_duration_seconds_bucket{le="5",tool!~"synthesize|search_multi_hop|agent_qa|summarize_entity|detect_contradiction|why|ingest_document|submit_memory_work|other"}[30m])) / clamp_min(sum(increase(brain_mcp_tool_duration_seconds_count{tool!~"synthesize|search_multi_hop|agent_qa|summarize_entity|detect_contradiction|why|ingest_document|submit_memory_work|other"}[30m])), 1)) / 0.05), "w", "short", "", ""))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [6] }
