version: 2
updates:
  # Backend service
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      backend-minor:
        update-types: ["minor", "patch"]
    ignore:
      # The runtime is Node 22 (Dockerfile, CI): types must describe it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Nest 12 line needs @nestjs/core 12 — a framework migration of its
      # own, not a dependency bump.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  # Marketing landing + docs + admin UI
  - package-ecosystem: npm
    directory: /brain-landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: landing"]
    groups:
      landing-minor:
        update-types: ["minor", "patch"]

  # MCP connector (@inite/brain-mcp) — standalone npm package
  - package-ecosystem: npm
    directory: /clients/brain-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: brain-mcp"]
    groups:
      brain-mcp-minor:
        update-types: ["minor", "patch"]

  # GitHub Actions — bumps the pinned SHAs (keeps the # vX comment in sync)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      actions:
        update-types: ["minor", "patch"]
