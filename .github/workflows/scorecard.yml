name: OpenSSF Scorecard

on:
  branch_protection_rule:
  # Weekly, plus whenever branch protection changes. It used to run on every
  # push to main too (64 runs in 11 days); the score moves with settings and
  # workflows, not with each merge, and a week is fresh enough for the badge.
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results needs a public repo. Skip on private until then.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          sarif_file: results.sarif
