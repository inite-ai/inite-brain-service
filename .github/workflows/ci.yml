# The family CI (inite-shared/.github/workflows/ci.yml): the same gate the
# pre-commit hook runs, with the unit tests. Main requires the `ci` job
# below. The service's own checks (build-test, supply-chain, the e2e suites,
# docker) stay in checks.yml.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: inite-ai/inite-shared/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      build: true

  ci:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success
