name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly schedule runs the real-LLM quality eval against main once
  # per day at 05:00 UTC (08:00 MSK). We deliberately keep the eval
  # OFF the per-push critical path: a 17-min run against the live
  # OpenAI API is too slow, too expensive in tokens, and too
  # non-deterministic (±5–15pp recall@k drift run-to-run on temp=0.1)
  # to block merges on. Absolute floors still catch hard regressions
  # via the unit/e2e suites; the eval here catches slow quality drift
  # at a cadence where a flake doesn't ruin somebody's afternoon.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      run_real_e2e:
        description: 'Also run the real e2e suite (requires OPENAI_API_KEY secret)'
        required: false
        default: 'false'
      run_eval:
        description: 'Also run the multi-vertical quality eval (requires OPENAI_API_KEY secret)'
        required: false
        default: 'false'

# Least-privilege default token: CI only reads the repo (build/test/lint).
permissions:
  contents: read

# Supersede a PR's own in-flight run when a new commit lands on the same
# branch. deploy-brain.yml has had this since it was written; CI never did,
# so every rebase or force-push — which this repo does on essentially every
# PR, to pick up main — left a 28-minute run burning a runner for a commit
# nobody would merge. The queue is shared, so those zombies delayed every
# other PR too.
#
# Keyed on the PR number when there is one, else the ref. An earlier version
# of this keyed on `github.ref` alone and claimed in this very comment that
# doing so collapsed a push and its pull_request event into one group. It
# does not: a push carries `refs/heads/<branch>` and a pull_request carries
# `refs/pull/<n>/merge`, so the two land in DIFFERENT groups and both run.
#
# That was not merely wasteful. Observed on PR #524: two runs started one
# second apart on the same commit, one was cancelled, and the cancelled run
# reported a FAILED `build-test` — a red required check produced by nothing
# but the duplicate. Keying on the PR number puts both events in one group so
# the second supersedes the first.
#
# main is deliberately excluded from cancellation: a push there is what the
# deploy and the release ride on, and a superseded merge must still report
# its own result rather than vanish as "cancelled".
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------
  # Change detection. Decides which gates this diff can possibly break.
  #
  # Deny-list shaped on purpose: only buckets that provably feed no gate
  # are skippable, and every other path — including one nobody has seen
  # before — runs everything. See the docblock in
  # scripts/ci/change-buckets.mjs for why an allowlist is the wrong shape
  # for CI even though it is the right shape for the deploy trigger, and
  # test/ci-change-buckets.unit-spec.ts for the guard that keeps a
  # gate-bearing file from hiding inside a skip bucket.
  # ---------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.classify.outputs.engine }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge-base diff below resolves. A shallow
          # clone yields no merge base and the classifier would then see an
          # empty file list — which it treats as "run everything", so the
          # failure mode is safe either way, just slow.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            # push to main, schedule and manual dispatch always run the full
            # pipeline: main is what the deploy and the release ride on, and
            # a partial verdict there is not a verdict.
            echo "[ci] event=$EVENT — running every gate"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # actions/checkout gives us refs/pull/N/merge, whose merge base with
          # base.sha IS base.sha, so the three-dot diff is exactly the PR's
          # own changes. If that cannot be resolved — a force-push mid-run, a
          # base branch rewritten under us — the list comes out empty, which
          # the classifier deliberately reads as "run everything" rather than
          # "skip everything". An unresolvable diff is a reason to be careful.
          if ! git diff --name-only "$BASE_SHA...HEAD" > changed-files.txt; then
            echo "[ci] could not diff against $BASE_SHA — running every gate"
            : > changed-files.txt
          fi
          node scripts/ci/classify-changes.mjs < changed-files.txt

  # ---------------------------------------------------------------------
  # Engine static gates: lint, format, typecheck, build. Together ~95s of
  # work, so they stay in one job — splitting them buys nothing but four
  # more cold installs.
  # ---------------------------------------------------------------------
  engine-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Lint
        # lint:ci has no --fix and fails on any warning, so a fixable violation
        # gates the build instead of being silently auto-fixed in CI (where the
        # fix is thrown away — the working tree isn't committed back).
        run: pnpm lint:ci

      # Formatting gate. ESLint owns correctness; Prettier owns layout
      # (eslint-plugin-prettier/recommended disables the conflicting ESLint
      # stylistic rules, and prettier/prettier is kept off so lint stays fast
      # — this separate --check is the formatting authority). Fails on any
      # unformatted src/test .ts; run `pnpm format` to fix.
      - name: Format check (prettier)
        run: pnpm format:check

      # Typecheck the WHOLE project, tests included. `nest build` only
      # compiles src/ (tsconfig.json excludes test/), so before this step a
      # type error in a spec only surfaced if/when ts-jest happened to run
      # that spec — a skipped or never-run spec shipped its type error
      # green. tsconfig.spec.json re-includes test/ and gates it here.
      #
      # Since the transpile-only change this is also the ONLY typecheck the
      # specs get: ts-jest runs isolatedModules and emits without a
      # program. That makes this step load-bearing rather than duplicative,
      # which is the trade the speed came from.
      - name: Typecheck (src + tests)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------
  # Unit suite + coverage ratchet.
  # ---------------------------------------------------------------------
  engine-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      # MEASURED, AND THE RESULT IS NOT WHAT IT LOOKS LIKE. On a confirmed
      # cache hit this step ran 1:26 against 1:27 on a confirmed miss, and
      # an e2e shard 2:58 against 3:03 — nothing, inside the noise. Once
      # ts-jest is transpile-only the per-file work is cheap enough that
      # redoing it costs about what unpacking the cache costs. The entry is
      # ~16MB and restores in two seconds, so it is kept as a hedge against
      # the transpile-only change ever being reverted — but do NOT read a
      # speed claim into it.
      - name: Restore ts-jest transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            jest-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
            jest-unit-${{ runner.os }}-

      # 403 specs: auth guard, calibration, CAS job-claim, conflict-explainer,
      # chat-router gates, …
      # --coverage activates the coverageThreshold floor in jest-unit.json
      # (an all-src ratchet: statements/lines 52%, branches 40%, functions
      # 45% — a few points under the current ~57/45/50/58 to prevent
      # backslide without brittleness; the threshold is inert without
      # --coverage, so local `pnpm test:unit` stays fast). Unit-only
      # coverage — the e2e suite carries additional real path coverage
      # that isn't collected here.
      - name: Unit tests (+ coverage ratchet)
        run: pnpm test:unit:cov

  # ---------------------------------------------------------------------
  # Socket suite: the 6 specs that bind real loopback HTTP servers
  # (.listen(0, '127.0.0.1')) live behind their own *.socket-spec.ts
  # config so `pnpm test` stays hermetic in sandboxes that forbid
  # listen(). ~25s — it shares a job with nothing because it needs no
  # database and finishes before any other job has finished installing.
  # ---------------------------------------------------------------------
  engine-socket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Socket unit tests (loopback listeners)
        run: pnpm test:socket

  # ---------------------------------------------------------------------
  # In-process e2e, sharded.
  #
  # This is the only lever that moves the number: measured on main
  # 2026-09-08 the whole build-test job ran 29:45 / 32:54 / 39:29 and the
  # e2e step alone was 23:54 / 26:33 / 34:21 of it. Everything else in the
  # old monolith was ≤3 minutes.
  #
  # Sharding was considered and rejected once — see the long docblock in
  # test/jest-e2e.json. Read in full, the rejection is narrower than it
  # looks: it says sharding "would not have prevented" the SIGABRT,
  # because that abort landed on a fresh worker's FIRST file and so a
  # fresh process per shard would not have avoided it. That is an argument
  # against sharding as a CRASH FIX, and it was correct. It is not an
  # argument against sharding as a SPEED FIX, and the crash it refers to
  # was root-caused and removed in the fixture (the e2e app no longer
  # loads any ONNX model), so the reason to leave the suite serial is
  # gone. The same docblock's CI counterpart already pre-committed to
  # this: "if the median crosses ~35 the answer is to shard the suite,
  # not a bigger number."
  #
  # Each shard is a separate runner and therefore a separate jest process,
  # a separate globalSetup and a separate SurrealDB container. That
  # REDUCES cross-suite coupling rather than adding it: a shard's database
  # now holds only that shard's tenants. The hazard is the mirror image —
  # a spec that passes today only because a sibling suite's fixture
  # populated a shared table (PR #474 had to fix exactly that class of
  # assertion) will fail once the sibling lands in another shard. That is
  # a real bug being surfaced, not one being introduced, and the shard
  # split was run to green before this landed.
  #
  # maxWorkers stays 1 WITHIN a shard: the native-heap corruption the
  # docblock documents is a property of the app's teardown path, not of
  # the worker count, and nothing here re-litigates it.
  # ---------------------------------------------------------------------
  engine-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    strategy:
      # Do not cancel sibling shards when one fails: a single flaky shard
      # would otherwise hide the results of the other three, and "which
      # shards were green" is the first question when triaging a shard
      # split.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Restore ts-jest transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Per-shard key: each shard transforms a different slice of the
          # tree, so one shared cache entry would be written four times
          # with four partial contents and the last writer would win.
          path: .jest-cache
          key: jest-e2e-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            jest-e2e-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
            jest-e2e-${{ matrix.shard }}-${{ runner.os }}-

      - name: In-process e2e (testcontainers + stubs) — shard ${{ matrix.shard }}/4
        # `pnpm test:e2e -- --shard=N/4` does NOT work: the flag arrives
        # after jest's own argv terminator and jest reads it as a positional
        # test-path pattern, matching zero files and exiting 1 ("Pattern:
        # --shard=1/4 - 0 matches"). Invoking jest directly is unambiguous.
        run: pnpm exec jest --config ./test/jest-e2e.json --shard=${{ matrix.shard }}/4

  # ---------------------------------------------------------------------
  # Real-Surreal job-queue suite (CAS claim / leader lease / zombie
  # reap / backoff). No OpenAI, no SDK — pure DB correctness against
  # testcontainers. ~20s.
  # ---------------------------------------------------------------------
  engine-jobs-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Jobs e2e (real Surreal, no OpenAI)
        run: pnpm test:e2e:jobs

  # ---------------------------------------------------------------------
  # The landing app. Its own runner, its own lockfile, its own failure.
  #
  # Split out of the engine job because `build-test` is a required check
  # and a landing lint violation was therefore blocking unrelated engine
  # hotfixes. typecheck and build are here because eslint-config-next
  # never typechecked: a type error in an admin component passed CI green
  # and only surfaced as a failed Docker build during the landing deploy,
  # where one `next build` covers every route — so a broken admin
  # component blocked the SEO-critical public site from shipping.
  # ---------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: brain-landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: brain-landing/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # i18n gate — admin components must use the getMessages() pipeline,
      # never hardcoded JSX literals. See brain-landing/eslint.config.mjs
      # and § Quality gates in CONTRIBUTING.md.
      - name: i18n lint — admin components
        run: pnpm lint:i18n

      # Full ESLint over the whole landing app (Next 16 removed `next lint`, so
      # this is eslint-config-next via the flat config). Gates on errors AND
      # ratchets the react-hooks-7 warnings: `lint:ci` carries a
      # `--max-warnings` cap equal to the current count, so the number can
      # only go down. Fix a warning, lower the cap in the same PR.
      - name: Lint (full, warning ratchet)
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (sitemap + locale parity)
        run: pnpm test

      # The same build the deploy image runs. Catches what lint cannot.
      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------
  # Supply-chain CVE gate. scorecard.yml + dependency-review.yml are both
  # gated on `repository.private == false`, so they no-op while this repo
  # is private — a lockfile dependency with a known CVE could merge
  # ungated despite SECURITY.md declaring supply-chain in scope. This job
  # runs `pnpm audit` regardless of visibility and blocks on high/critical.
  # `--ignore-workspace` matches the install: it audits THIS repo's
  # lockfile only, never a stray parent pnpm workspace.
  #
  # Unconditional: it is its OWN required status check by name, so it must
  # report on every PR including a docs-only one.
  # ---------------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      # Blocks the PR on any high/critical advisory in the resolved
      # dependency tree. Dependabot (4 ecosystems) still opens the fix PRs;
      # this is the gate that stops a known-vulnerable tree from merging.
      - name: pnpm audit (high+ blocks)
        run: pnpm audit --audit-level=high --ignore-workspace

  # ---------------------------------------------------------------------
  # Image build + smoke, and on main the PUBLISH.
  #
  # This job used to build an image, smoke it, and throw it away; the
  # deploy then rebuilt the same source on a self-hosted runner and shipped
  # whatever that produced. Nothing tied the artifact that was tested to
  # the artifact that ran in production — same source, different build, no
  # identity between them.
  #
  # Now the image is built once, here, and on main it is pushed and its
  # DIGEST recorded. The smoke test then pulls that digest back and runs
  # THAT, so what CI verified is the same bytes the deploy pins. The
  # digest travels to deploy-brain.yml in the deploy-manifest artifact.
  #
  # No longer `needs: build-test` — it never needed the test results to
  # build an image, and depending on the gate would be a cycle now that the
  # gate depends on it.
  # ---------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pull-request runs — including from forks, which get no secrets at
      # all — build locally and never touch the registry. This is the plain
      # `docker build` that has always run here, kept deliberately: routing
      # the PR path through buildx with `load: true` would be a new,
      # untested build mechanism on the path that runs most often, in
      # exchange for nothing. The publish path below uses the same
      # build-push-action invocation deploy-brain.yml has been running in
      # production, so neither path is new.
      - name: Build image (PR — local only, not published)
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
        run: docker build -t inite-brain-service:ci .

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image (main)
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:buildcache,mode=max
          platforms: linux/amd64

      # Re-tag the PUBLISHED digest as the local name the smoke step uses,
      # so on main the thing being smoke-tested is fetched back from the
      # registry by digest rather than taken on trust from the build cache.
      # If the registry ever served something other than what we pushed,
      # this is where it shows up.
      - name: Pull back the published digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          echo "[ci] pulling $IMAGE"
          docker pull "$IMAGE"
          docker tag "$IMAGE" inite-brain-service:ci

      - name: Smoke run
        run: |
          docker network create brain-ci
          docker run -d --name surreal --network brain-ci \
            surrealdb/surrealdb:v3.2.4 \
            start --user=root --pass=root --bind=0.0.0.0:8000 memory
          sleep 5
          docker run -d --name brain --network brain-ci -p 3030:3000 \
            -e SURREALDB_URL=ws://surreal:8000 \
            -e SURREALDB_USERNAME=root \
            -e SURREALDB_PASSWORD=root \
            -e SURREALDB_NAMESPACE=brain \
            -e SURREALDB_SCOPED_USER=brain_caller \
            -e SURREALDB_SCOPED_PASS=ci-scoped-pass \
            -e OPENAI_API_KEY=sk-ci-stub \
            -e BRAIN_API_KEYS='[]' \
            -e FORGET_HMAC_KEY=ci-hmac-key-must-be-at-least-32-chars \
            inite-brain-service:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3030/health >/dev/null; then
              echo "service healthy"
              curl -s http://localhost:3030/health
              exit 0
            fi
            sleep 1
          done
          echo "service did not become healthy"
          docker logs brain
          exit 1

      # The handoff to the deploy. Written only on main, only after the
      # smoke test above passed, and carrying the digest — not a tag.
      # A tag is a mutable pointer that says "whatever :latest means when
      # you pull"; a digest is the artifact. deploy-brain.yml refuses to
      # deploy without this file, so a deploy whose image CI never
      # verified fails loudly instead of shipping.
      - name: Record the deploy manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "[ci] the publish step produced no digest — refusing to write a manifest"
            exit 1
          fi
          printf '{"sha":"%s","image":"%s@%s","digest":"%s","runId":"%s"}\n' \
            "${{ github.sha }}" "$IMAGE_REPO" "$DIGEST" "$DIGEST" "${{ github.run_id }}" \
            > deploy-manifest.json
          cat deploy-manifest.json

      - name: Upload the deploy manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: deploy-manifest
          path: deploy-manifest.json
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # THE GATE. `build-test` is a required status check on main and only a
  # repo admin can change that list, so the NAME stays even though the job
  # no longer runs a build or a test. It judges the jobs that do.
  #
  # The subtlety is that GitHub reports `skipped` both for "your `if:`
  # said no" and for "something you needed failed", and the two must land
  # on opposite sides of the gate. scripts/ci/gate.mjs disambiguates by
  # checking each result against an expectation recomputed from the same
  # change-detection outputs the job's own `if:` used;
  # test/ci-gate-truth.unit-spec.ts pins that table to this YAML so the
  # duplication cannot rot, and fails if a job is added here without being
  # judged.
  # ---------------------------------------------------------------------
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      [
        changes,
        engine-checks,
        engine-unit,
        engine-socket,
        engine-e2e,
        engine-jobs-e2e,
        web,
        docker,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Judge
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
          GATE_ENGINE: ${{ needs.changes.outputs.engine }}
          GATE_WEB: ${{ needs.changes.outputs.web }}
        run: node scripts/ci/gate.mjs

  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_real_e2e == 'true'
    needs: build-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Checkout inside the workspace (actions/checkout refuses paths
      # outside GITHUB_WORKSPACE since v3). Then symlink to ../inite-shared
      # so tsconfig.json's "@inite/knowledge" path alias resolves at compile
      # and test time without changing source.
      - name: Checkout inite-shared (sibling for SDK source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/inite-shared
          path: inite-shared-checkout
          token: ${{ secrets.INITE_SHARED_PAT || github.token }}

      - name: Symlink inite-shared as sibling
        run: ln -sf "$GITHUB_WORKSPACE/inite-shared-checkout" "$GITHUB_WORKSPACE/../inite-shared"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Real e2e (separate process + real OpenAI + SDK + MCP)
        env:
          OPENAI_API_KEY: ${{ secrets.BRAIN_OPENAI_API_KEY }}
        run: pnpm test:e2e:real

  # Multi-vertical quality eval — recall@k, MRR, extraction-recall,
  # PII gating, identity-resolution. Hard thresholds asserted inside
  # test/quality.real-e2e-spec.ts (overall AND per-vertical), so a
  # regression here fails the job. Gated on a real OPENAI_API_KEY
  # because the eval depends on production-shape extraction +
  # embedding behaviour, not stubs.
  #
  # Trigger surface — deliberately OFF push-to-main:
  #   - schedule (nightly 05:00 UTC) — slow-drift watchdog
  #   - workflow_dispatch with run_eval=true (manual, any branch)
  #
  # Why not on push to main? The live-OpenAI eval is ~17 min, non-
  # deterministic (±5–15pp recall@k drift on temp=0.1), and burns
  # tokens. Putting it on the merge critical path means every push
  # is a coin flip — see history before this change: 16/20 main
  # runs failed, almost all on eval flake or SDK-epoch drift after
  # the v4→v5 upgrade. Per-push protection is the unit/e2e suites
  # plus docker smoke; the eval is a daily watchdog, not a gate.
  quality-eval:
    runs-on: ubuntu-latest
    # Covers install + build + container start (~5 min) plus the eval test's
    # own 30 min cap (the eval runs ~19-20 min on real OpenAI; see the
    # timeout note in quality.real-e2e-spec.ts).
    timeout-minutes: 40
    # Schedule and manual dispatch only. PR/push events skip this job.
    # (For dispatch the run_eval input still has to be true so an ad-
    # hoc dispatch of CI doesn't spend tokens unexpectedly.)
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_eval == 'true')
    needs: build-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NOTE: the old workflow checked out a sibling `inite-shared`
      # repo here to resolve the `@inite/knowledge` tsconfig alias. The
      # eval doesn't need that SDK — it speaks HTTP directly to the
      # spawned brain process via test/eval/http-brain-client.ts. We
      # deliberately stay self-contained so quality-eval doesn't
      # depend on cross-repo PAT secrets.

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      # Delta-gate baseline is now a FROZEN golden committed at
      # test/eval/golden-baseline.json — not a cache-restored,
      # self-promoted snapshot. The old cache flow promoted every green
      # nightly's report into the next run's baseline, so a slow ~1pp/night
      # drift within the diff tolerance ratcheted the comparison floor down
      # over time. Anchoring to a committed golden removes that ratchet: the
      # comparison reference only moves when a human re-measures and commits
      # a new golden (regen: pnpm test:eval with BRAIN_EVAL_REPORT_OUT
      # pointing at the golden path, on a clean main, under real OpenAI).
      # The absolute overall floors in test/quality.real-e2e-spec.ts (PR #31)
      # remain the hard anti-erosion anchor; this diff is the drift detector.
      - name: Quality eval (multi-vertical, real OpenAI)
        env:
          # Repo secret is `BRAIN_OPENAI_API_KEY` (org convention —
          # every inite-* service prefixes its OpenAI key with the
          # service name). The eval harness reads `OPENAI_API_KEY`,
          # so we alias.
          OPENAI_API_KEY: ${{ secrets.BRAIN_OPENAI_API_KEY }}
          # Tells the spec to write a machine-readable JSON report
          # alongside the human markdown — consumed by the diff step.
          BRAIN_EVAL_REPORT_OUT: .eval-current/report.json
        run: pnpm test:eval

      - name: Compare to frozen golden (delta-gate)
        run: |
          # Diff against the committed golden, never a cache-promoted
          # snapshot — no ratchet. eval:diff blocks on regressions beyond
          # per-metric tolerances; improvements never block.
          pnpm eval:diff test/eval/golden-baseline.json .eval-current/report.json
