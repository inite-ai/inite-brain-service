name: Deploy brain.inite.ai

on:
  push:
    branches: [main]
    # `test/**` is intentionally not in the ignore list — `test/eval/scenarios`
    # and `test/eval/fixtures` ship inside the prod image (admin scenario
    # runner reads them at runtime), so a scenario-only change must trigger
    # a deploy. Use explicit `paths` if a narrower trigger is ever needed.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.planning/**'
      # The monitoring stack has its own deploy workflow
      # (deploy-monitoring.yml) — don't redeploy brain for it.
      - 'monitoring/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | restart | logs'
        required: false
        default: 'deploy'

# Cancel an in-flight auto-deploy when a new push lands. Manual
# dispatches keep their own concurrency group so they don't fight
# auto-deploys.
concurrency:
  group: deploy-brain-${{ github.event_name }}
  cancel-in-progress: true

env:
  PROJECT_NAME: inite-brain-service
  DOMAIN: brain.inite.ai
  PORT: 3000

# Least-privilege default token: checkout only. Registry auth uses Docker Hub
# secrets, not GITHUB_TOKEN; deploy runs on a self-hosted runner via compose.
permissions:
  contents: read

jobs:
  build-and-push:
    # Skip build for restart/logs ops. Push events have no inputs,
    # so the inputs.action check defaults to true (build runs).
    if: github.event_name == 'push' || (github.event.inputs.action != 'restart' && github.event.inputs.action != 'logs')
    runs-on: [self-hosted, sfo]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # @inite/knowledge SDK is a test-only import (TS path mapping in
      # tsconfig.json points at ../inite-shared/...). Production build
      # only compiles src/ and ships dist/main.js — no SDK code is
      # bundled. So we skip the inite-shared checkout: nothing to fetch.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:buildcache,mode=max
          platforms: linux/amd64

      - name: Build info
        run: |
          echo "[ok] Image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:${{ github.sha }}"

  deploy:
    needs: build-and-push
    # Run the deploy job when:
    #   - push event: only after a successful build
    #   - workflow_dispatch deploy: only after a successful build
    #   - workflow_dispatch restart/logs: skip build, run anyway
    if: |
      always() && (
        (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (needs.build-and-push.result == 'success' || github.event.inputs.action == 'restart' || github.event.inputs.action == 'logs'))
      )
    runs-on: [self-hosted, sfo]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event.inputs.action != 'logs'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Logs
        if: github.event.inputs.action == 'logs'
        run: |
          cd /opt/projects/${{ env.PROJECT_NAME }}
          docker-compose logs --tail=200 ${{ env.PROJECT_NAME }}

      - name: Write enablement env file
        if: github.event.inputs.action != 'logs'
        # The full-enablement flag set (2026-09 wave, owner-ordered: every
        # default-off FEATURE flag ON). Lives in its own step + env_file
        # because embedding it in the compose heredoc below blew GitHub's
        # 21k max-expression-length limit for the run script (zero-job
        # "workflow file issue" failure). The heredoc delimiter is QUOTED
        # ('EOF') so the body is a pure literal — no GitHub expressions,
        # no shell expansion; the only expressions in this step are the
        # two step-level env values.
        # Excluded by agreement: operational/eval toggles
        # (INGEST_EPISODE_ONLY, THROTTLE_DISABLED, tenant override, debug
        # traces), EMBEDDING_* space-migration tooling, the experimental
        # MULTILINGUAL T1-T5 family, and mutually-exclusive mode switches
        # (RETRIEVAL_GENRE stays assistant_chat; PPR stays adaptive via
        # threshold).
        env:
          PROJECT_DIR: /opt/projects/${{ env.PROJECT_NAME }}
          EVIDENCE_URL_SECRET: ${{ secrets.BRAIN_EVIDENCE_URL_SECRET }}
        run: |
          mkdir -p "${PROJECT_DIR}"
          tee "${PROJECT_DIR}/enablement.env" > /dev/null << 'EOF'
          # ── L0 episode substrate + read APIs ──
          EPISODE_SUBSTRATE_ENABLED=1
          EPISODES_API_ENABLED=1
          EPISODE_SUBSCRIPTIONS_ENABLED=1
          PROJECTIONS_API_ENABLED=1
          FACTS_API_ENABLED=1
          USER_PROFILE_API_ENABLED=1
          STATS_VIEWS_ENABLED=1
          LIVE_SUBSCRIPTIONS_ENABLED=1
          AUDIT_CHANGEFEED_ENABLED=1
          # ── Ingest / extraction quality ──
          EXTRACTION_OBJECT_NORMALIZE=1
          EXTRACTOR_ROUTING_ENABLED=1
          EXTRACTOR_DROP_SAID=1
          INGEST_INLINE_RESOLUTION_ENABLED=1
          INGEST_INLINE_RESOLUTION_HNSW=1
          INGEST_CONTEXTUAL_FACT_EMBEDDING=1
          INGEST_EVENT_TIME_EXTRACTION=1
          INGEST_BATCH_EDGES=1
          INGEST_BATCH_FACTS=1
          INGEST_SANITIZE_UNICODE=1
          # ── Session deriver (prompt/schema change => new derivedVersion) ──
          DERIVER_ASSISTANT_CONTENT=1
          DERIVER_SLOT_SEMANTICS=1
          DERIVER_MENTION_STAMP=1
          DERIVER_TURN_HEADERS=1
          DERIVER_DATE_RESOLVE=1
          DERIVER_DATE_AUDIT=1
          DERIVER_ASPECT_ROLLUPS=1
          DERIVER_COMPOSE_PASS=1
          DERIVER_SCENE_TRACE=1
          DERIVER_TYPED_ATOMS=1
          DERIVER_SPANS=1
          DERIVER_DIGEST=1
          DERIVER_COMPLETION_PASS=1
          DERIVER_SALIENCE_STAMP=1
          # ── Verbatim/segment/episodic lanes + rerank legs ──
          # PIN: legacy lane flags imply verbatim='always' (dialogue
          # profile) when RETRIEVAL_VERBATIM_EVIDENCE is unset — pin the
          # assistant-chat mode so the lanes do NOT flip the genre.
          RETRIEVAL_VERBATIM_EVIDENCE=shape_conditioned
          SEARCH_EPISODIC_LANE_ENABLED=1
          SYNTHESIZE_SOURCE_EXCERPTS=1
          SEARCH_SEGMENT_LANE_ENABLED=1
          SEARCH_SEGMENT_LANE_RERANK=1
          SEARCH_FACT_RERANK=1
          # ── Search stack ──
          SEARCH_HNSW_ENABLED=1
          SEARCH_COMBINED_VECTOR_GRAPH=1
          SEARCH_HIGHLIGHT_ENABLED=1
          SEARCH_USAGE_RECORDING_ENABLED=1
          SEARCH_USAGE_DECAY_ENABLED=1
          SEARCH_USAGE_RANKING_ENABLED=1
          SEARCH_USAGE_BETA=0.1
          RETRIEVAL_VERIFIED_USE_DECAY=1
          RETRIEVAL_VERIFIED_USE_RANKING=1
          SEARCH_VERIFIED_USE_BETA=0.1
          RETRIEVAL_TENANT_DECAY=1
          # ── Retrieval profile boolean points (V8-V13 + G2 L3) ──
          RETRIEVAL_ENTITY_EXPANSION=1
          RETRIEVAL_SALIENCE_SCORING=1
          RETRIEVAL_UPDATE_STORY=1
          RETRIEVAL_DIGEST_EVIDENCE=1
          RETRIEVAL_ORDERING_FRAME=1
          RETRIEVAL_VERIFIER_TOPIC_COVERAGE=1
          RETRIEVAL_MENTION_DATES=1
          RETRIEVAL_ENUM_STRICT=1
          RETRIEVAL_SCENE_TRACES=1
          RETRIEVAL_RAW_WINDOW=1
          RETRIEVAL_ASSISTANT_LANE=1
          RETRIEVAL_FACTS_AS_KEYS=1
          RETRIEVAL_FRAGMENT_LANE=1
          RETRIEVAL_TIME_FILTER=1
          RETRIEVAL_DATE_MATH=1
          RETRIEVAL_ANSWER_CONDITIONING=1
          RETRIEVAL_NOISE_FILTER=1
          RETRIEVAL_SEARCH_LOOP=1
          RETRIEVAL_L3_ESCALATION=1
          RETRIEVAL_L3_DIRECT_ANCHOR=1
          RETRIEVAL_L3_SEGMENT_ANCHOR=1
          RETRIEVAL_L3_TEMPORAL_ANCHOR=1
          # ── Synthesize: typed dispatch + wide probe + cache ──
          SYNTHESIZE_ANSWER_ROUTER_ENABLED=1
          SYNTHESIZE_LANE_WIDE_PROBE=1
          SYNTHESIZE_INSTRUCTION_LANE=1
          SYNTHESIZE_ANSWER_CACHE=1
          # ── G4 strategy-memory lane ──
          STRATEGY_MEMORY_ENABLED=1
          STRATEGY_RETRIEVAL_ENABLED=1
          STRATEGY_DISTILL_CRON_ENABLED=1
          STRATEGY_TRAJECTORIES_ENABLED=1
          # ── Dreams + compaction lifecycle ──
          DREAMS_ENABLED=1
          DREAMS_RUN_SUMMARIZE=1
          DREAMS_DEDUP_ENABLED=1
          DREAMS_RESOLVE_ENABLED=1
          DREAMS_CORROBORATE_ENABLED=1
          DREAMS_COMMUNITIES_ENABLED=1
          DREAMS_LLM_SUMMARY_ENABLED=1
          COMPACTION_PROMOTION_ENABLED=1
          COMPACTION_SUMMARIES=1
          COMPACTION_PROMOTION_CONFLICT_GUARD=1
          # ── Scenes + beliefs (Brain v2 episodic/semantic planes) ──
          SCENES_SEGMENTATION_ENABLED=1
          SCENES_TOPIC_BOUNDARY=1
          SCENES_LLM_ENRICHMENT=1
          SCENES_FACT_BACKLINK=1
          SCENES_VERSION_FINGERPRINT=1
          SCENES_BELIEF_PROMOTION=1
          SCENES_BELIEF_LLM_SYNTHESIS=1
          SCENES_EVIDENCE_LINKS=1
          PACK_MEMORY_PROJECTIONS_ENABLED=1
          BELIEFS_API_ENABLED=1
          BELIEFS_SERVING_LANE=1
          BELIEFS_FACT_DAMPING=1
          # ── Evidence plane (grounding + lifecycle + raw-read) ──
          EVIDENCE_SUBSTRATE_ENABLED=1
          EVIDENCE_INGEST_ENABLED=1
          EVIDENCE_GROUNDING_STAMP=1
          EVIDENCE_FAIL_CLOSED_CAPTURE=1
          EVIDENCE_UNGROUNDED_EXCLUDE=1
          EVIDENCE_UNGROUNDED_SERVING_GATE=1
          EVIDENCE_PROCESSOR_BROKER=1
          EVIDENCE_QUARANTINE=1
          EVIDENCE_RAW_READ_ENABLED=1
          EVIDENCE_FRAGMENT_CITATIONS=1
          # ── Provenance DAG ──
          PROVENANCE_SUMMARY_EPISODE_STAMP=1
          PROVENANCE_RECURSIVE_CLOSURE=1
          PROVENANCE_SUPPORT_EDGES=1
          PROVENANCE_SUPPORT_GRAPH_READ=1
          # ── Outcome telemetry + tool observations ──
          OUTCOME_TELEMETRY_ENABLED=1
          OUTCOME_RETRIEVED_EVENTS=1
          OUTCOME_TX_WRITES=1
          OUTCOME_DECISION_CAPTURE=1
          TOOL_OBSERVATIONS_ENABLED=1
          TOOL_OBSERVATION_CONTENT=1
          # ── Fovea optics + serving integrity ──
          FOVEA_FOCUS_CAPTURE=1
          FOVEA_ADAPTIVE_L3=1
          FOVEA_ADAPTIVE_ABSTAIN=1
          FOVEA_LENS_SUPPRESS=1
          FOVEA_PLAUSIBILITY_CHECK=1
          FOVEA_REQUIRE_CITATIONS=1
          FOVEA_L3_EPISODE_CITATIONS=1
          FOVEA_EVIDENCE_CAPABILITY=1
          FOVEA_FRAGMENT_ZOOM=1
          FOVEA_ATTENTION_HINTS=1
          # ── Access control / privacy fences ──
          # PRIVACY_SEGMENT_USER_FENCE is fail-closed on legacy rows: run
          # POST /v1/admin/maintenance/segments/backfill-user-ids per
          # tenant right after this deploy.
          ABAC_ENABLED=1
          ABAC_DB_FENCE_ENABLED=1
          SCOPE_TAGS_ENABLED=1
          SOURCE_META_STRICT=1
          POLICY_META_UNION_ENABLED=1
          PRIVACY_SEGMENT_USER_FENCE=1
          PRIVACY_COMPOSER_USER_SCOPE=1
          # ── Packs / MCP / QA ──
          MCP_PACK_EXTERNAL_TOOLS_ENABLED=1
          AGENT_QA_TOOLS_V2=1
          EOF
          # The heredoc carries the YAML block's 10-space indent into the
          # file; strip it so every line is a clean KEY=value / #comment
          # regardless of the compose dotenv parser's whitespace rules.
          sed -i 's/^[[:space:]]*//' "${PROJECT_DIR}/enablement.env"
          # HMAC for minted raw-evidence URLs, appended via shell so the
          # heredoc stays literal. Empty/unset secret is a boot WARNING
          # (raw streaming serves; mint 503s) — create the
          # BRAIN_EVIDENCE_URL_SECRET repo secret (>= 32 chars) to
          # activate signed URLs. A short secret is a boot ERROR.
          echo "EVIDENCE_SIGNED_URL_SECRET=${EVIDENCE_URL_SECRET}" >> "${PROJECT_DIR}/enablement.env"
          echo "[ok] wrote $(grep -c . "${PROJECT_DIR}/enablement.env") enablement.env lines"

      - name: Deploy to server
        if: github.event.inputs.action != 'logs'
        run: |
          mkdir -p /opt/projects/${{ env.PROJECT_NAME }}
          cd /opt/projects/${{ env.PROJECT_NAME }}

          # Brain talks to the SHARED inite-surrealdb container that lives in
          # the temporal stack (inite-temporal/docker-compose). Brain owns
          # NS=brain (separate from gateway's NS=inite); per-tenant DBs are
          # co_<companyId> created on first request via ensureSchema.
          # Migration 0005 creates the brain_caller editor user — first
          # ensureSchema run on a fresh tenant boots it before the scoped
          # pool tries to sign in.
          tee docker-compose.yml > /dev/null << EOF
          services:
            ${{ env.PROJECT_NAME }}:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:latest
              container_name: ${{ env.PROJECT_NAME }}
              restart: unless-stopped
              # PID-1 init (tini): reaps zombie children from the worker
              # pool / native deps and forwards signals so SIGTERM reaches
              # Node cleanly.
              init: true
              # The app's graceful shutdown drains in-flight work for up to
              # 15s (main.ts); Docker's default 10s SIGKILLs mid-drain, so
              # give it headroom past that budget.
              stop_grace_period: 30s
              expose:
                - "${{ env.PORT }}"
              environment:
                - NODE_ENV=production
                - PORT=${{ env.PORT }}
                - LOG_FORMAT=json
                # Shared SurrealDB — same instance gateway uses.
                # NS=inite (shared namespace; brain's tables knowledge_*
                # don't collide with gateway's). Per-tenant DBs are
                # co_<companyId> created on first request via ensureSchema.
                - SURREALDB_URL=ws://inite-surrealdb:8000
                - SURREALDB_USERNAME=${{ secrets.BRAIN_SURREAL_USER }}
                - SURREALDB_PASSWORD=${{ secrets.BRAIN_SURREAL_PASS }}
                - SURREALDB_NAMESPACE=inite
                - SURREALDB_POOL_SIZE=8
                - SURREALDB_SCOPED_POOL_SIZE=8
                - SURREALDB_SCOPED_USER=brain_caller
                - SURREALDB_SCOPED_PASS=${{ secrets.BRAIN_SURREAL_SCOPED_PASS }}
                # OpenAI for embeddings + extraction + faithfulness verifier.
                - OPENAI_API_KEY=${{ secrets.BRAIN_OPENAI_API_KEY }}
                - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
                - OPENAI_EMBEDDING_DIMENSIONS=1536
                - OPENAI_CHAT_MODEL=gpt-4o-mini-2024-07-18
                # OpenAI client budget — same as eval. Per-stage budgets
                # in search.service.ts (SEARCH_STAGE_BUDGET_MS) cap the
                # end-to-end pipeline regardless of what individual calls
                # take, so we don't need OPENAI_TIMEOUT_MS to be the
                # circuit breaker.
                - OPENAI_TIMEOUT_MS=30000
                - OPENAI_MAX_RETRIES=3
                - OPENAI_CONCURRENCY=8
                # Auth — JWKS via auth.inite.ai. NODE_ENV=production +
                # JWKS enabled ⇒ static BRAIN_API_KEYS is REJECTED, JWT only.
                # The brain-landing admin BFF gets its JWT through the
                # auth-service client_credentials grant — see
                # deploy-brain-landing.yml for OAUTH_CLIENT_ID/SECRET wiring.
                - AUTH_SERVICE_URL=https://auth.inite.ai
                - AUTH_SERVICE_JWKS_URL=https://auth.inite.ai/.well-known/jwks.json
                - AUTH_SERVICE_AUDIENCE=brain
                # Required: JwksService refuses to boot in production when JWKS
                # is enabled without an issuer (else the `iss` claim is not
                # validated). Must match the `iss` auth-service signs with.
                - AUTH_SERVICE_ISSUER=https://auth.inite.ai
                # GDPR forget HMAC — opaque tombstone marker.
                - FORGET_HMAC_KEY=${{ secrets.BRAIN_FORGET_HMAC_KEY }}
                # Search retrieval features — eval-validated ON config.
                # Now safe to keep on because each LLM stage runs under
                # its own withStageBudget wrapper (search.service.ts):
                # router=2s, reranker=4s (parallel SC), cross-encoder=2s,
                # backfill=2s. A stalled LLM fail-opens with the previous
                # stage's result; the request still completes inside the
                # overall pipeline budget instead of stacking 90s × N.
                # Platform refactor 2026-08: SEARCH_RERANKER_ENABLED /
                # SEARCH_HYPE_ENABLED / SEARCH_PREDICATE_ROUTER_ENABLED are
                # deleted keys — the LLM reranker is a capability now (runs
                # because OPENAI_API_KEY is set, bounded by stage budget +
                # SEARCH_RERANK_SKIP_MARGIN); HyPE and the predicate router
                # were removed with their code (never measured to a verdict
                # in the eval program).
                # Retrieval profile (docs/operations.md): prod is the
                # assistant-chat default on every dimension —
                # verbatim=shape_conditioned, dateAnchoring=absolute. The
                # genre tag documents that intent for operators.
                - RETRIEVAL_GENRE=assistant_chat
                - SEARCH_RERANKER_SC_N=3
                # PPR over the candidate subgraph (HippoRAG-style). Auto
                # threshold lowered from 100 → 25 so the typical per-tenant
                # graph (~30-80 candidates) actually triggers it. Hub-effect
                # pathology on truly small graphs is bounded by the edge
                # expansion below capping new buckets — neighbour fan-out
                # was the real source of the 30-entity recall@1 regression
                # in the original PPR rollout.
                - SEARCH_PPR_ENABLED=0
                - SEARCH_PPR_AUTO_THRESHOLD=25
                # Edge-based candidate expansion (always on since the
                # platform refactor folded SEARCH_EDGE_EXPANSION_ENABLED).
                # Top-3 entities by post-bucketing rankScore seed a 1-hop
                # walk over knowledge_edge; neighbours not retrieved by
                # vector/BM25 enter the candidate set with inherited
                # rankScore = α × seed × edge_weight. α=0.4 — inherited
                # score never beats a direct retrieval hit.
                - SEARCH_EDGE_EXPANSION_TOP_SEEDS=3
                - SEARCH_EDGE_EXPANSION_MAX_NEIGHBOURS=5
                - SEARCH_EDGE_EXPANSION_ALPHA=0.4
                # Multi-hop edge expansion: when a hop's combination is
                # subset_of_previous, expand the prior entity set to
                # include 1-hop neighbours over knowledge_edge before
                # anchoring. Turns the chain into a true graph-walk
                # instead of pure set-membership. ON as part of the
                # 2026-09 full-enablement wave (measured null, not
                # negative, in the eval program).
                - MULTI_HOP_EDGE_EXPANSION_ENABLED=1
                # Per-stage budgets (ms). Tunable without redeploy of
                # search.service.ts. Defaults match the constants there;
                # overrides only when prod traffic shape changes.
                - SEARCH_STAGE_BUDGET_ROUTER_MS=2000
                - SEARCH_STAGE_BUDGET_RERANK_MS=4000
                - SEARCH_STAGE_BUDGET_CROSS_ENCODER_MS=2000
                - SEARCH_STAGE_BUDGET_BACKFILL_MS=2000
                # Source-reputation trust at read time (source-reputation phase
                # 5, docs/source-reputation.md). finalScore ×= (1 + β·(trust−0.5))
                # × (1 + γ·min(corroboration, 3)). Turned ON after the quality
                # eval was rerun with the flags set: overall recall@1 0.9466,
                # recall@3 0.9885, MRR 0.9683 (n=262) — within tolerance of the
                # trust-off baseline, delta-gate green. Conservative values:
                # neutral sources (learnedTrust 0.5, no corroboration) stay a
                # ×1.0 no-op, so the effect ramps gracefully as the nightly
                # refit accumulates domain-scoped reputation.
                - SEARCH_TRUST_BETA=0.15
                - SEARCH_CORROBORATION_GAMMA=0.1
                # ── Document pipeline (Source → Indexer → Candidates → Brain,
                # docs/document-pipeline.md) ─────────────────────────────
                # Master switch: POST /v1/ingest/document + the /v1/documents/*
                # surface + the MCP ingest_document tool. Additive endpoints.
                - DOCUMENT_INGEST_ENABLED=1
                # Dedicated per-pack indexer runs + relevance router + the
                # async (queue-driven) fan-out. LLM fan-out is capped by
                # MAX_DEDICATED_INDEXERS_PER_DOC (default 8).
                - DOCUMENT_MULTI_INDEXER_ENABLED=1
                # Route live mention ingestion through the pipeline (response
                # contract preserved). Safe to enable now that the indexer_run
                # reopen/reaper (#142) makes a crashed run recoverable.
                - INGEST_MENTION_VIA_DOCUMENT=1
                # Backfill stored documents with a pack's vocabulary on
                # install/upgrade (bounded by REINDEX_MAX_DOCS_PER_RUN=500).
                - REINDEX_ON_PACK_INSTALL=1
                # ── Marketplace billing (paid domain packs) ─────────────
                # Pull-only entitlement checks against the central billing
                # service (60s TTL cache, fail-closed for PAID packs only —
                # free packs never touch billing). Brain is registered as
                # billing Service code=brain; entitlement key is
                # domain_pack:<packId>, billing userId = brain companyId.
                - DOMAIN_PACK_BILLING_ENABLED=1
                - BILLING_SERVICE_URL=https://billing.inite.ai
                - BILLING_SERVICE_API_KEY=${{ secrets.BRAIN_BILLING_API_KEY }}
                # ── MCP pack tools (docs/mcp-pack-tools.md) ─────────────
                # Master ON: consented packs may register declarative QUERY
                # tools (namespace-locked, row-fenced). EXTERNAL proxy tools
                # stay off until a pack actually ships one.
                - MCP_PACK_TOOLS_ENABLED=1
                # Deliberately NOT set (default off): DOCUMENT_ALLOW_UNGROUNDED_
                # EXTERNAL (security opt-in — lets external indexers stage
                # unverifiable spans) and SEARCH_CROSS_ENCODER_LOCAL (prod uses
                # the LLM reranker; no Cohere/cross-encoder configured).
                # ── Hybrid pipeline knobs ────────────────────────────────
                # Chat router (Sprints 1-4.5): cache, embedding hints,
                # collapse cache, intent classification, skip gate.
                - CHAT_ROUTE_CACHE_ENABLED=true
                - CHAT_ROUTE_CACHE_SIZE=2000
                - CHAT_ROUTE_HINT_SIMILARITY=0.4
                - CHAT_ROUTE_HINT_MAX=3
                - CHAT_ROUTE_INTENT_CONFIDENCE_FLOOR=0.85
                - CHAT_ROUTE_NLI_ENABLED=true
                - CHAT_ROUTE_NLI_ASK_THRESHOLD=0.6
                # Extractor (Sprints E1-E7): cache, local predicate select,
                # local NER, learned pattern cache, skip gate.
                - EXTRACTOR_CACHE_ENABLED=true
                - EXTRACTOR_CACHE_SIZE=500
                # text-embedding-3-small + verbose predicate cards rarely
                # hit 0.85 even on semantic match; 0.55 keeps alias
                # precision high while catching the common cases the
                # academic threshold misses ("job_title"→"status",
                # "preferred_food"→"preference").
                - PREDICATE_CANONICALIZE_THRESHOLD=0.55
                - EXTRACTOR_LOCAL_PREDICATE_THRESHOLD=0.45
                # Opt-in: downloads ~135MB ONNX on first ingest. Required
                # for the E7 skip gate to fire.
                - EXTRACTOR_LOCAL_NER_ENABLED=true
                - EXTRACTOR_LOCAL_NER_MIN_SCORE=0.7
                # Opt-in: synthesises ExtractionResult from local clauses
                # + NER + pattern cache when every check passes. Pattern
                # cache populates as LLM extractions land, so the gate
                # starts cold and warms with usage.
                - EXTRACTOR_SKIP_LLM_ENABLED=true
                # Phase 3.C ConU conformal guardrail (synthesize.service).
                # Floor on the isotonic-calibrated confidence below which a
                # fact is not eligible as a citation target — facts above
                # still appear in the search response, just don't ground
                # the generator. 0.30 matches the bitemporal resolver
                # reject_threshold so a fact admitted as INSERTED is also
                # admitted as a citation. Drop to 0 to disable.
                - SYNTHESIZE_MIN_CONFIDENCE=0.30
                # OpenTelemetry GenAI SemConv. When enabled, every
                # gen_ai.chat.* and gen_ai.embed.* span carries the
                # standard semconv attributes (gen_ai.system,
                # gen_ai.request.model, gen_ai.usage.*).
                - OTEL_ENABLED=1
                # OTLP/HTTP receiver in the monitoring stack's Alloy
                # (shared traefik-global network; deploy-monitoring.yml).
                # BASE url only — the SDK exporter appends /v1/traces.
                # Alloy forwards to Tempo; browse in Grafana Explore.
                - OTEL_EXPORTER_OTLP_ENDPOINT=http://inite-monitoring-alloy:4318
                # ── Multilingual embedder (Phase 4.D) ───────────────────
                # BGE-M3 via @xenova/transformers, local CPU inference.
                # 1024-dim multilingual cross-lingual recall vs OpenAI's
                # text-embedding-3-small (1536-dim, English-biased).
                #
                # ROLLOUT MUST follow the reindex playbook:
                #   1. Deploy this commit so the BGE-M3 provider is
                #      preferred. Warmup is now non-blocking (commit
                #      0cde424), so the container goes /health=ok
                #      immediately and serves search/synthesize on the
                #      openai fallback during the ~10s ONNX load.
                #   2. After /ready returns 200 (model warm), an
                #      operator runs:
                #        curl -X POST -H 'Authorization: Bearer <admin>' \
                #          'https://brain.inite.ai/api/v1/admin/reindex/embeddings?dryRun=true'
                #      to size the work, then re-runs without dryRun
                #      to write the new vectors per tenant.
                #   3. Old vectors stay searchable until rewritten —
                #      reindex is idempotent.
                #
                # Drop to `openai` to roll back to text-embedding-3-small.
                - EMBEDDER_PROVIDER=bge-m3
                # Eval baselines — persisted to a host bind-mount so they
                # survive container recreate (compose pull + up = new
                # container; an in-image var/ would evaporate on every
                # deploy and the diff feature would silently lose history).
                - BRAIN_BASELINES_DIR=/var/brain/baselines
                # ── Phase J/K job queue (Surreal-native) ─────────────────
                # Cron handlers (dreams, compaction, calibration_refit,
                # source_trust_refit) write to job_run as 'pending';
                # WorkerLoopService — gated by the 'worker_loop'
                # leader_lease — claims and dispatches.
                #
                # Kill switch: set JOBS_QUEUE_MODE=inline + restart to
                # roll back to the legacy guard.run() inline path
                # without a redeploy. Use when an unexpected backlog
                # accumulates in pending and the worker loop won't
                # drain (handler not registered, lease acquire fails).
                - JOBS_QUEUE_MODE=enqueue
                - WORKER_LOOP_ENABLED=1
                - WORKER_LOOP_POLL_MS=1000
                - WORKER_LOOP_EMPTY_BACKOFF_MS=5000
                - WORKER_LOOP_LEASE_RENEW_MS=30000
                - LEASE_MANAGER_ENABLED=1
                - JOB_RUN_MAX_ATTEMPTS=3
                - JOB_RUN_BACKOFF_BASE_MS=30000
                # CPU-bound dispatcher pool. Disabled (size=0) because
                # no current handler is registered as cpuBound — the
                # scaffolding is there for future heavy jobs (multi-pass
                # extractor offload, batch normalisation). Flip to 2+
                # when a handler opts in via register({ cpuBound: true,
                # workerModule: __dirname + '/X.worker-job.js' }).
                - JOB_WORKER_POOL_SIZE=0
              # Full-enablement feature-flag set (2026-09 wave) — written
              # by the "Write enablement env file" step above. Kept OUT of
              # this heredoc deliberately: the run script contains GitHub
              # expressions, so its whole body counts against the 21k
              # max-expression-length limit, and the ~190-line flag block
              # pushed it over (zero-job "workflow file issue" failure).
              # compose precedence: `environment:` above overrides
              # env_file on key collision.
              env_file:
                - ./enablement.env
              volumes:
                - /opt/projects/${{ env.PROJECT_NAME }}/baselines:/var/brain/baselines
              labels:
                # ── Backend routes only — landing handles the rest of brain.inite.ai.
                # Backend owns /v1/*, /mcp/*, /health, /metrics.
                # Traefik sorts by rule length so this PathPrefix-restricted
                # router naturally outranks the landing's Host-only catch-all.
                #
                # /openapi.json used to be claimed here and was a 404 the whole
                # time: this service has no route for it, no Swagger module, and
                # the image does not even ship docs/openapi.json — the Dockerfile
                # copies src, dist and package.json, nothing else. Claiming the
                # path only guaranteed the request never reached anything that
                # could answer it. The document is a committed static artifact,
                # so it now falls through to the landing's catch-all and is
                # served out of brain-landing/public alongside /install.sh and
                # /skills.tar.gz, written there by scripts/build-openapi.ts.
                - "traefik.enable=true"
                - "traefik.docker.network=traefik-global"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}.rule=Host(\`${{ env.DOMAIN }}\`) && (PathPrefix(\`/v1\`) || PathPrefix(\`/mcp\`) || PathPrefix(\`/health\`))"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}.priority=200"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}.entrypoints=websecure"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}.tls=true"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}.tls.certresolver=letsencrypt"
                - "traefik.http.services.${{ env.PROJECT_NAME }}.loadbalancer.server.port=${{ env.PORT }}"
                - "traefik.http.services.${{ env.PROJECT_NAME }}.loadbalancer.responseForwarding.flushInterval=-1"
                # http→https redirect for the same backend paths (landing has its own).
                - "traefik.http.routers.${{ env.PROJECT_NAME }}-http.rule=Host(\`${{ env.DOMAIN }}\`) && (PathPrefix(\`/v1\`) || PathPrefix(\`/mcp\`) || PathPrefix(\`/health\`))"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}-http.priority=200"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}-http.entrypoints=web"
                - "traefik.http.routers.${{ env.PROJECT_NAME }}-http.middlewares=redirect-to-https"
                - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
                - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost:${{ env.PORT }}/health"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 30s
              # Resource ceilings: local ONNX (BGE-M3 / NER) + worker pool
              # + LLM fan-out can balloon RSS. Without a cap an unbounded
              # container can OOM the shared host / trip the kernel OOM
              # killer mid-job. Raised 2g -> 4g for the enablement wave:
              # SEARCH_FACT_RERANK / SEGMENT_LANE_RERANK / NOISE_FILTER
              # lazily load the local cross-encoder worker (~280MB
              # bge-reranker-base) on top of BGE-M3 + NER.
              mem_limit: 4g
              mem_reservation: 1536m
              cpus: 2.0
              pids_limit: 512
              networks:
                - traefik-global
                - default

          networks:
            traefik-global:
              external: true
          EOF

          # Bind-mount target must exist and be writable by the container's
          # node user (uid 1000 on node:22-slim — the image now runs as
          # USER node, so this chown matches the runtime user). Without
          # this docker creates it root-owned and BaselineService's
          # fs.writeFile fails with EACCES on first save.
          mkdir -p /opt/projects/${{ env.PROJECT_NAME }}/baselines
          chown -R 1000:1000 /opt/projects/${{ env.PROJECT_NAME }}/baselines || true

          if [ "${{ github.event.inputs.action }}" = "restart" ]; then
            echo "[deploy] restart only"
            docker-compose restart ${{ env.PROJECT_NAME }}
          else
            echo "[deploy] pulling image..."
            docker-compose pull ${{ env.PROJECT_NAME }}
            echo "[deploy] up -d"
            docker-compose up -d --remove-orphans
          fi

          sleep 25

          if docker-compose ps | grep -q "Up"; then
            echo "[ok] ${{ env.DOMAIN }} container is up"
          else
            echo "[err] container failed to start"
            docker-compose logs --tail=100 ${{ env.PROJECT_NAME }}
            exit 1
          fi

      - name: Internal health probe
        if: github.event.inputs.action != 'logs'
        run: |
          cd /opt/projects/${{ env.PROJECT_NAME }}
          # Internal probe via docker exec — bypasses DNS / Traefik /
          # cert provisioning. This is the gate signal: did brain itself
          # boot and respond. External reachability checked separately
          # (warning-only) so a missing DNS record or slow Let's Encrypt
          # cert doesn't fail an otherwise-healthy deploy.
          for i in $(seq 1 18); do
            if docker-compose exec -T ${{ env.PROJECT_NAME }} wget -qO- http://localhost:${{ env.PORT }}/health > /dev/null 2>&1; then
              echo "[ok] container responds on http://localhost:${{ env.PORT }}/health"
              docker-compose exec -T ${{ env.PROJECT_NAME }} wget -qO- http://localhost:${{ env.PORT }}/health | head -c 500
              echo ""
              exit 0
            fi
            echo "[info] waiting for brain to come up... ($i/18)"
            sleep 5
          done
          echo "[err] internal health never responded"
          docker-compose logs --tail=120 ${{ env.PROJECT_NAME }}
          exit 1

      - name: Internal readiness probe (warning-only)
        if: github.event.inputs.action != 'logs'
        continue-on-error: true
        run: |
          cd /opt/projects/${{ env.PROJECT_NAME }}
          # /health (gate above) is liveness — green as soon as Nest boots,
          # while the bge-m3 embedder is still warming and the app serves on
          # the OpenAI fallback. /ready 503s until DB + embedder are warm.
          # Surfaced as warning-only (NOT a gate) because a cold-image ONNX
          # download can exceed this window without anything being wrong;
          # failing the deploy on it would be a false alarm. Gives ops a
          # clear "booted but not yet warm" signal in the deploy log.
          for i in $(seq 1 24); do
            if docker-compose exec -T ${{ env.PROJECT_NAME }} wget -qO- http://localhost:${{ env.PORT }}/ready > /dev/null 2>&1; then
              echo "[ok] container is READY (db + embedder warm)"
              exit 0
            fi
            echo "[info] booted, waiting for readiness (embedder warmup)... ($i/24)"
            sleep 5
          done
          echo "[warn] /ready never went green within 120s — embedder may still be warming; serving on OpenAI fallback until then"

      - name: External health probe (warning-only)
        if: github.event.inputs.action != 'logs'
        continue-on-error: true
        run: |
          # Best-effort — DNS may not be wired yet, Let's Encrypt cert
          # provisioning can take 30-90s on first deploy. Failure here
          # surfaces as a workflow warning, not a deploy block.
          for i in $(seq 1 12); do
            if curl -fs https://${{ env.DOMAIN }}/health > /dev/null 2>&1; then
              echo "[ok] https://${{ env.DOMAIN }}/health responds"
              curl -s https://${{ env.DOMAIN }}/health | head -c 500
              echo ""
              exit 0
            fi
            echo "[info] external probe retry ($i/12)..."
            sleep 10
          done
          echo "[warn] https://${{ env.DOMAIN }}/health never responded — check DNS A-record + Traefik cert in droplet logs"

      - name: Cleanup
        if: always() && github.event.inputs.action != 'logs'
        run: docker system prune -f
