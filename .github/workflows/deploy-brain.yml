name: Deploy brain.inite.ai

on:
  push:
    branches: [main]
    # An ALLOWLIST, not an ignore list. It used to be the other way round,
    # which meant the engine rebuilt and redeployed for anything not
    # explicitly excluded — including every `brain-landing/**` change, i.e.
    # every landing and admin-panel edit, none of which enter this image.
    # The landing has owned its own deploy (deploy-brain-landing.yml, with
    # its own allowlist) all along; the coupling was one-directional.
    #
    # The list below is derived from the Dockerfile: the image copies
    # package.json, pnpm-lock.yaml, tsconfig.json, nest-cli.json and src/,
    # and nothing else. The compose file is generated inline by this
    # workflow, so there is no external stack file to watch.
    #
    # This is self-maintaining rather than a list somebody must remember to
    # update: anything NEW entering the image needs a COPY, and `Dockerfile`
    # is itself in the allowlist — so the commit that starts shipping a new
    # path also trips the trigger. test/deploy-trigger-truth.unit-spec.ts
    # pins that property.
    #
    # (The previous comment here claimed `test/**` had to trigger a deploy
    # because test/eval/scenarios ships in the image. That stopped being
    # true when eval moved to src/eval to honour the
    # production-code-must-not-import-from-test rule — see the Dockerfile.)
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'nest-cli.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-brain.yml'
  workflow_dispatch:
    inputs:
      action:
        # `rollback` redeploys the newest digest in the confirmed-good
        # history that is NOT the one running, so it steps BACK off a
        # release that went green and then turned out to be bad. It is the
        # manual twin of the automatic rollback the deploy job performs
        # when its own verification fails; see § Rollback in
        # docs/operations.md.
        description: 'deploy | restart | logs | rollback'
        required: false
        default: 'deploy'
      image_digest:
        # Only read by action=rollback, and only accepted when the digest
        # appears in .good-image-history — an arbitrary digest typed into
        # a box is not a verified release.
        description: 'rollback target digest (must be in the confirmed-good history); blank = newest good that is not running'
        required: false
        default: ''

# ONE group for every run that can mutate production state on the box,
# and it QUEUES rather than cancels.
#
# It used to be keyed by `github.event_name`, so a push deploy and a
# manual dispatch ran concurrently over the same state files: run A could
# pass smoke, run B overwrite `.pending-image`, and A's finalize then
# promote B as verified (audit F2). Serialising by event name did not help
# — the two groups were the two racers.
#
# `cancel-in-progress: false` is equally load-bearing: the deploy state
# machine spans three jobs (deploy → smoke → finalize) and cancelling
# between them leaves a half-applied transaction on the box with nobody
# left to promote or undo it.
concurrency:
  group: deploy-brain-production
  cancel-in-progress: false

env:
  PROJECT_NAME: inite-brain-service
  DOMAIN: brain.inite.ai
  PORT: 3000

# Least-privilege default token: checkout only. Registry auth uses Docker Hub
# secrets, not GITHUB_TOKEN; deploy runs on a self-hosted runner via compose.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # The deploy no longer builds anything.
  #
  # It used to: this workflow rebuilt the image from source on the
  # self-hosted runner, pushed it as :latest, and the deploy pulled
  # :latest. Two things were wrong with that, and they compound.
  #
  # First, nothing connected the artifact CI tested to the artifact
  # production ran. Same source, two builds, no identity between them —
  # and the SHA tag this workflow already pushed was never consumed by
  # anything, so it could not even serve as a manual rollback target
  # without hand-editing the compose file.
  #
  # Second, ci.yml and this workflow both fired on `push` to main, in
  # parallel, with no ordering. A red main deployed; the only thing
  # between a broken merge and brain.inite.ai was whether the deploy's
  # build happened to be slower than the test suite.
  #
  # So this job does neither: it waits for CI's verdict on THIS commit,
  # then takes the digest CI recorded after it smoke-tested the pushed
  # image. It runs on a GitHub-hosted runner, deliberately — the wait can
  # be twenty minutes and the single self-hosted deploy runner should not
  # spend them idle.
  #
  # `on: workflow_run` would give the CI conclusion for free and is
  # rejected: it carries no `paths:` filter, and this workflow's path
  # trigger is a guarded, load-bearing thing. Trading a tested trigger for
  # an untested one to save a poll loop is a bad trade.
  # ---------------------------------------------------------------------
  verify:
    # restart, logs and rollback do not deploy a NEW image, so none of
    # them needs a freshly verified artifact. rollback in particular must
    # work when CI is red — that is the situation it exists for.
    if: github.event_name == 'push' || (github.event.inputs.action == 'deploy' || github.event.inputs.action == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Reading another workflow's run status, and downloading its artifact.
      actions: read
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for CI to conclude on this commit
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWAIT_SHA: ${{ github.sha }}
          AWAIT_TIMEOUT_MINUTES: '45'
        run: node scripts/ci/await-ci.mjs

      - name: Download the deploy manifest CI published
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: deploy-manifest
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Resolve the image digest
        id: manifest
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/ci/read-deploy-manifest.mjs

  deploy:
    needs: verify
    # Run the deploy job when:
    #   - push event: only after CI went green and a digest was resolved
    #   - workflow_dispatch deploy: same
    #   - workflow_dispatch restart/logs: no image needed, run anyway
    if: |
      always() && (
        (github.event_name == 'push' && needs.verify.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (needs.verify.result == 'success' || github.event.inputs.action == 'restart' || github.event.inputs.action == 'logs' || github.event.inputs.action == 'rollback'))
      )
    runs-on: [self-hosted, sfo]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event.inputs.action != 'logs'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Logs
        if: github.event.inputs.action == 'logs'
        run: |
          cd /opt/projects/${{ env.PROJECT_NAME }}
          docker-compose logs --tail=200 ${{ env.PROJECT_NAME }}

      - name: Write enablement env file
        if: github.event.inputs.action != 'logs'
        # The full-enablement flag set (2026-09 wave, owner-ordered: every
        # default-off FEATURE flag ON). Lives in its own step + env_file
        # because embedding it in the compose heredoc below blew GitHub's
        # 21k max-expression-length limit for the run script (zero-job
        # "workflow file issue" failure). The heredoc delimiter is QUOTED
        # ('EOF') so the body is a pure literal — no GitHub expressions,
        # no shell expansion; the only expressions in this step are the
        # two step-level env values.
        # Excluded by agreement: operational/eval toggles
        # (INGEST_EPISODE_ONLY, THROTTLE_DISABLED, tenant override, debug
        # traces), EMBEDDING_* space-migration tooling, the experimental
        # MULTILINGUAL T1-T5 family, and mutually-exclusive mode switches
        # (RETRIEVAL_GENRE stays assistant_chat; PPR stays adaptive via
        # threshold).
        env:
          PROJECT_DIR: /opt/projects/${{ env.PROJECT_NAME }}
          EVIDENCE_URL_SECRET: ${{ secrets.BRAIN_EVIDENCE_URL_SECRET }}
        run: |
          mkdir -p "${PROJECT_DIR}"
          tee "${PROJECT_DIR}/enablement.env" > /dev/null << 'EOF'
          # ── L0 episode substrate + read APIs ──
          EPISODE_SUBSTRATE_ENABLED=1
          EPISODES_API_ENABLED=1
          EPISODE_SUBSCRIPTIONS_ENABLED=1
          PROJECTIONS_API_ENABLED=1
          FACTS_API_ENABLED=1
          USER_PROFILE_API_ENABLED=1
          STATS_VIEWS_ENABLED=1
          LIVE_SUBSCRIPTIONS_ENABLED=1
          AUDIT_CHANGEFEED_ENABLED=1
          # ── Ingest / extraction quality ──
          EXTRACTION_OBJECT_NORMALIZE=1
          EXTRACTOR_ROUTING_ENABLED=1
          EXTRACTOR_DROP_SAID=1
          INGEST_INLINE_RESOLUTION_ENABLED=1
          INGEST_INLINE_RESOLUTION_HNSW=1
          INGEST_CONTEXTUAL_FACT_EMBEDDING=1
          INGEST_EVENT_TIME_EXTRACTION=1
          INGEST_BATCH_EDGES=1
          INGEST_BATCH_FACTS=1
          INGEST_SANITIZE_UNICODE=1
          # ── Session deriver (prompt/schema change => new derivedVersion) ──
          DERIVER_ASSISTANT_CONTENT=1
          DERIVER_SLOT_SEMANTICS=1
          DERIVER_MENTION_STAMP=1
          DERIVER_TURN_HEADERS=1
          DERIVER_DATE_RESOLVE=1
          DERIVER_DATE_AUDIT=1
          DERIVER_ASPECT_ROLLUPS=1
          DERIVER_COMPOSE_PASS=1
          DERIVER_SCENE_TRACE=1
          DERIVER_TYPED_ATOMS=1
          DERIVER_SPANS=1
          DERIVER_DIGEST=1
          DERIVER_COMPLETION_PASS=1
          DERIVER_SALIENCE_STAMP=1
          # ── Verbatim/segment/episodic lanes + rerank legs ──
          # PIN: legacy lane flags imply verbatim='always' (dialogue
          # profile) when RETRIEVAL_VERBATIM_EVIDENCE is unset — pin the
          # assistant-chat mode so the lanes do NOT flip the genre.
          RETRIEVAL_VERBATIM_EVIDENCE=shape_conditioned
          SEARCH_EPISODIC_LANE_ENABLED=1
          SYNTHESIZE_SOURCE_EXCERPTS=1
          SEARCH_SEGMENT_LANE_ENABLED=1
          SEARCH_SEGMENT_LANE_RERANK=1
          SEARCH_FACT_RERANK=1
          # ── Search stack ──
          # Provisioning follows this flag by default (the schema-ready
          # hook and the nightly sweep read SEARCH_HNSW_ENABLED unless
          # HNSW_PROVISION_ENABLED is set explicitly), so the line above
          # also turns index creation on — no separate pin restating it.
          # Provisioning only ADDS absent indexes, always CONCURRENTLY,
          # capped at 5 tenants starting builds per nightly run.
          SEARCH_HNSW_ENABLED=1
          SEARCH_COMBINED_VECTOR_GRAPH=1
          SEARCH_HIGHLIGHT_ENABLED=1
          SEARCH_USAGE_RECORDING_ENABLED=1
          SEARCH_USAGE_DECAY_ENABLED=1
          SEARCH_USAGE_RANKING_ENABLED=1
          SEARCH_USAGE_BETA=0.1
          RETRIEVAL_VERIFIED_USE_DECAY=1
          RETRIEVAL_VERIFIED_USE_RANKING=1
          SEARCH_VERIFIED_USE_BETA=0.1
          RETRIEVAL_TENANT_DECAY=1
          # ── Retrieval profile boolean points (V8-V13 + G2 L3) ──
          RETRIEVAL_ENTITY_EXPANSION=1
          RETRIEVAL_SALIENCE_SCORING=1
          RETRIEVAL_UPDATE_STORY=1
          RETRIEVAL_DIGEST_EVIDENCE=1
          RETRIEVAL_ORDERING_FRAME=1
          RETRIEVAL_VERIFIER_TOPIC_COVERAGE=1
          RETRIEVAL_MENTION_DATES=1
          RETRIEVAL_ENUM_STRICT=1
          RETRIEVAL_SCENE_TRACES=1
          RETRIEVAL_RAW_WINDOW=1
          RETRIEVAL_ASSISTANT_LANE=1
          RETRIEVAL_FACTS_AS_KEYS=1
          RETRIEVAL_FRAGMENT_LANE=1
          RETRIEVAL_TIME_FILTER=1
          RETRIEVAL_DATE_MATH=1
          RETRIEVAL_ANSWER_CONDITIONING=1
          RETRIEVAL_NOISE_FILTER=1
          RETRIEVAL_SEARCH_LOOP=1
          RETRIEVAL_L3_ESCALATION=1
          RETRIEVAL_L3_DIRECT_ANCHOR=1
          RETRIEVAL_L3_SEGMENT_ANCHOR=1
          RETRIEVAL_L3_TEMPORAL_ANCHOR=1
          # ── Synthesize: typed dispatch + wide probe + cache ──
          SYNTHESIZE_ANSWER_ROUTER_ENABLED=1
          SYNTHESIZE_LANE_WIDE_PROBE=1
          SYNTHESIZE_INSTRUCTION_LANE=1
          SYNTHESIZE_ANSWER_CACHE=1
          # ── G4 strategy-memory lane ──
          STRATEGY_MEMORY_ENABLED=1
          STRATEGY_RETRIEVAL_ENABLED=1
          STRATEGY_DISTILL_CRON_ENABLED=1
          STRATEGY_TRAJECTORIES_ENABLED=1
          # ── Dreams + compaction lifecycle ──
          DREAMS_ENABLED=1
          DREAMS_RUN_SUMMARIZE=1
          DREAMS_DEDUP_ENABLED=1
          DREAMS_RESOLVE_ENABLED=1
          DREAMS_CORROBORATE_ENABLED=1
          DREAMS_COMMUNITIES_ENABLED=1
          DREAMS_LLM_SUMMARY_ENABLED=1
          COMPACTION_PROMOTION_ENABLED=1
          COMPACTION_SUMMARIES=1
          COMPACTION_PROMOTION_CONFLICT_GUARD=1
          # ── Scenes + beliefs (Brain v2 episodic/semantic planes) ──
          SCENES_SEGMENTATION_ENABLED=1
          SCENES_TOPIC_BOUNDARY=1
          SCENES_LLM_ENRICHMENT=1
          SCENES_FACT_BACKLINK=1
          SCENES_VERSION_FINGERPRINT=1
          SCENES_BELIEF_PROMOTION=1
          SCENES_BELIEF_LLM_SYNTHESIS=1
          SCENES_EVIDENCE_LINKS=1
          PACK_MEMORY_PROJECTIONS_ENABLED=1
          BELIEFS_API_ENABLED=1
          BELIEFS_SERVING_LANE=1
          BELIEFS_FACT_DAMPING=1
          # ── Evidence plane (grounding + lifecycle + raw-read) ──
          EVIDENCE_SUBSTRATE_ENABLED=1
          EVIDENCE_INGEST_ENABLED=1
          EVIDENCE_GROUNDING_STAMP=1
          EVIDENCE_FAIL_CLOSED_CAPTURE=1
          EVIDENCE_UNGROUNDED_EXCLUDE=1
          EVIDENCE_UNGROUNDED_SERVING_GATE=1
          EVIDENCE_PROCESSOR_BROKER=1
          EVIDENCE_QUARANTINE=1
          EVIDENCE_RAW_READ_ENABLED=1
          EVIDENCE_FRAGMENT_CITATIONS=1
          # ── Provenance DAG ──
          PROVENANCE_SUMMARY_EPISODE_STAMP=1
          PROVENANCE_RECURSIVE_CLOSURE=1
          PROVENANCE_SUPPORT_EDGES=1
          PROVENANCE_SUPPORT_GRAPH_READ=1
          # ── Outcome telemetry + tool observations ──
          OUTCOME_TELEMETRY_ENABLED=1
          OUTCOME_RETRIEVED_EVENTS=1
          OUTCOME_TX_WRITES=1
          OUTCOME_DECISION_CAPTURE=1
          TOOL_OBSERVATIONS_ENABLED=1
          TOOL_OBSERVATION_CONTENT=1
          # ── Fovea optics + serving integrity ──
          FOVEA_FOCUS_CAPTURE=1
          FOVEA_ADAPTIVE_L3=1
          FOVEA_ADAPTIVE_ABSTAIN=1
          FOVEA_LENS_SUPPRESS=1
          FOVEA_PLAUSIBILITY_CHECK=1
          FOVEA_REQUIRE_CITATIONS=1
          FOVEA_L3_EPISODE_CITATIONS=1
          FOVEA_EVIDENCE_CAPABILITY=1
          FOVEA_FRAGMENT_ZOOM=1
          FOVEA_ATTENTION_HINTS=1
          # ── Access control / privacy fences ──
          # PRIVACY_SEGMENT_USER_FENCE is fail-closed on legacy rows: run
          # POST /v1/admin/maintenance/segments/backfill-user-ids per
          # tenant right after this deploy.
          ABAC_ENABLED=1
          ABAC_DB_FENCE_ENABLED=1
          SCOPE_TAGS_ENABLED=1
          SOURCE_META_STRICT=1
          POLICY_META_UNION_ENABLED=1
          PRIVACY_SEGMENT_USER_FENCE=1
          PRIVACY_COMPOSER_USER_SCOPE=1
          # ── Capability probes (active monitoring) ──
          # Not pinned here: the probe is on unless CAPABILITY_PROBE_ENABLED=0,
          # which is also its kill switch (set it and restart). Cost: one
          # LIMIT 1 read + one short embed per pod per minute; the incidents
          # it covers (#502 scoped pool anonymous, #503 embedder answering
          # cross-space) both reached production while /health and /ready
          # were green.
          # ── Packs / MCP / QA ──
          MCP_PACK_EXTERNAL_TOOLS_ENABLED=1
          AGENT_QA_TOOLS_V2=1
          # ── Memory-fitness fix wave (#415-#417, measured on the stand:
          # same-memory re-ask 16/30 -> 20/29; D2 timeline 3/3, D6 2/2) ──
          READ_SURFACE_USER_SCOPE=1
          CONFLICT_DIRECT_FACT_SLOT=1
          BELIEFS_LANE_DATE_DISAMBIGUATION=1
          PROVENANCE_EPISODE_NEIGHBOURS=1
          # ── Literal harvest + belief transitions (#423/#426, measured:
          # memory-fitness 70% -> 90% with the harvest lane; Compass
          # acceptance green — negation revision + field fold) ──
          EXTRACTOR_LITERAL_HARVEST=1
          SCENES_BELIEF_NEGATION_DELTAS=1
          SCENES_BELIEF_FIELD_FOLD=1
          # ── State-verb harvest (#429/#431, measured: state-transition
          # battery 4/12 -> 8/12 scenarios, checks 84%; held-out
          # adversarial set 18/18; unit 29/29 incl. holder binding) ──
          EXTRACTOR_STATE_VERB_HARVEST=1
          # ── Answer conditioning (V13 G2 shape instructions; existing
          # flag, was never enabled — the aggregation shape's coverage
          # instruction fixes broad-question domain dropout. Measured on
          # the stand 2026-09-06, flag-off vs flag-on: domain-packs
          # battery 14/15 -> 15/15, state-transitions 8/12 -> 10/12
          # scenarios (checks 84% -> 92%), memory-fitness 27/30 ->
          # 28/30; pointed-question isolation checks unaffected) ──
          RETRIEVAL_ANSWER_CONDITIONING=1
          # ── Mention-path conflict formation (#444) + transition
          # classifier (#446, BGE-M3 prototypes calibrated offline:
          # P=0.906 R=0.879 on 76 labeled items). Measured together on
          # the stand: state-transition battery 9/12 (checks 88%),
          # code-memory battery 13/16 — no regression vs the flags-off
          # runs. Note: s07 stays red for a deeper reason (the two
          # contradicting arms extract into DIFFERENT slots —
          # status vs duration_limit — so no single_active collision
          # exists to pair; slot canonicalization is the follow-up). ──
          CONFLICT_MENTION_FACT_SLOT=1
          EXTRACTOR_TRANSITION_CLASSIFIER=1
          # ── s07/k07/k10 root-cause wave (#450 #454 #455 #456, all
          # live-verified on the stand 2026-09-06):
          # - slot canonicalization: calendar-anchored duration claims
          #   meet lifecycle claims in one status slot;
          # - article-insensitive entity reuse: "the office lease" ==
          #   "office lease" (unique-match-only);
          # - cosine floor open for promoted single_active mention slots
          #   rides CONFLICT_MENTION_FACT_SLOT (no separate flag) — the
          #   (office lease, status) COMPETING pair forms end-to-end;
          # - lang-filter confidence gate: a lone foreign stopword
          #   ("120 requests per MINUTE" → lang=it@0.33) no longer hides
          #   facts from the hard en-filter; the filter still applies
          #   when detection clears the 0.5 confidence floor.
          # Measured: code-memory battery k07 flipped green (14/16);
          # transitions/domain-packs/memory-fitness no regression. ──
          CONFLICT_SLOT_CANONICALIZATION=1
          INGEST_ARTICLE_NORMALIZATION=1
          MULTILINGUAL_LANG_FILTER_CONFIDENCE_GATE=1
          # ── Temporal tiebreaker (#465, migration 0129): the promoted
          # conflict machinery was pairing legitimate UPDATES (queue
          # Redis -> NATS) into permanent COMPETING mush — score margin
          # alone cannot tell an update from a contradiction, and
          # validFrom windows measurably do not separate them either
          # (s07's contradiction arms are 6 diary-days apart). The
          # working discriminators: succession language ("is now",
          # "no longer", "instead of") + artifact-backed incumbents
          # are never closed by recency. Measured: memory-fitness
          # 23/30 -> 26/30-equivalent (d1-queue/d1-launch serve current
          # values again); transitions baseline-identical with the s07
          # contradiction pair intact. Includes stuck-COMPETING
          # re-admission and same-origin restatement dedup. ──
          CONFLICT_TEMPORAL_TIEBREAKER=1
          EOF
          # The heredoc carries the YAML block's 10-space indent into the
          # file; strip it so every line is a clean KEY=value / #comment
          # regardless of the compose dotenv parser's whitespace rules.
          sed -i 's/^[[:space:]]*//' "${PROJECT_DIR}/enablement.env"
          # HMAC for minted raw-evidence URLs, appended via shell so the
          # heredoc stays literal. Empty/unset secret is a boot WARNING
          # (raw streaming serves; mint 503s) — create the
          # BRAIN_EVIDENCE_URL_SECRET repo secret (>= 32 chars) to
          # activate signed URLs. A short secret is a boot ERROR.
          echo "EVIDENCE_SIGNED_URL_SECRET=${EVIDENCE_URL_SECRET}" >> "${PROJECT_DIR}/enablement.env"
          echo "[ok] wrote $(grep -c . "${PROJECT_DIR}/enablement.env") enablement.env lines"

      - name: Deploy to server
        if: github.event.inputs.action != 'logs'
        # Everything the script needs from the workflow context comes in as
        # environment, not as `${{ }}` spliced into the script. GitHub treats
        # a `run:` that contains any expression as ONE expression and caps
        # it at 21000 characters; this step is ~26k, so the file was invalid
        # and every deploy since #523 failed before a job started ("Exceeded
        # max expression length 21000"). Reading secrets from env is also the
        # documented practice — a value never becomes shell source.
        env:
          IMAGE_FROM_CI: ${{ needs.verify.outputs.image }}
          ACTION: ${{ github.event.inputs.action }}
          # Explicit rollback target (optional); validated against the
          # confirmed-good history below.
          IMAGE_INPUT: ${{ github.event.inputs.image_digest }}
          # How many identical containers of this service to run. Repo
          # variable, empty ⇒ 1. Every check below counts against it.
          BRAIN_REPLICAS: ${{ vars.BRAIN_REPLICAS }}
          BRAIN_SURREAL_USER: ${{ secrets.BRAIN_SURREAL_USER }}
          BRAIN_SURREAL_PASS: ${{ secrets.BRAIN_SURREAL_PASS }}
          BRAIN_SURREAL_SCOPED_PASS: ${{ secrets.BRAIN_SURREAL_SCOPED_PASS }}
          BRAIN_OPENAI_API_KEY: ${{ secrets.BRAIN_OPENAI_API_KEY }}
          BRAIN_FORGET_HMAC_KEY: ${{ secrets.BRAIN_FORGET_HMAC_KEY }}
          BRAIN_BILLING_API_KEY: ${{ secrets.BRAIN_BILLING_API_KEY }}
        run: |
          # The project directory is the deploy's whole state store. It is
          # read from the environment (defaulting to the real path) so the
          # truth test can run these exact fragments over a temp dir —
          # test/deploy-race-truth.unit-spec.ts extracts them from this
          # file.
          PROJECT_DIR="${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}"
          mkdir -p "${PROJECT_DIR}"
          cd "${PROJECT_DIR}"

          # Desired replica count. One malformed value must not silently
          # become "1" and quietly scale production down.
          BRAIN_REPLICAS="${BRAIN_REPLICAS:-1}"
          case "${BRAIN_REPLICAS}" in
            ''|*[!0-9]*) echo "[err] BRAIN_REPLICAS must be a positive integer, got '${BRAIN_REPLICAS}'"; exit 1 ;;
          esac
          [ "${BRAIN_REPLICAS}" -ge 1 ] || { echo "[err] BRAIN_REPLICAS must be >= 1"; exit 1; }
          echo "BRAIN_REPLICAS=${BRAIN_REPLICAS}" >> "$GITHUB_ENV"
          echo "[deploy] replicas: ${BRAIN_REPLICAS}"

          # Replica-aware helpers, shared by this job's later steps and by
          # finalize (same host, same directory). Generated rather than
          # repeated six times: every check has to count or iterate now
          # that the service is N containers, and six hand-copied loops
          # drift. Values are baked at generation time.
          tee deploy-lib.sh > /dev/null << EOF
          # Generated by .github/workflows/deploy-brain.yml — not edited on the box.
          SERVICE="${PROJECT_NAME}"
          SERVICE_PORT="${PORT}"
          DESIRED_REPLICAS="${BRAIN_REPLICAS}"
          EOF
          tee -a deploy-lib.sh > /dev/null << 'EOF'

          # Container ids compose created for the service, running or not.
          replica_ids() { docker-compose ps -q "$SERVICE" 2>/dev/null || true; }

          # How many of them are actually running. `docker-compose ps` prose
          # is not parsed: one of N being up passed the old grep for "Up".
          running_replicas() {
            local ids n
            ids="$(replica_ids)"
            if [ -z "$ids" ]; then echo 0; return 0; fi
            n="$(docker inspect -f '{{.State.Status}}' $ids 2>/dev/null | grep -c '^running$' || true)"
            echo "${n:-0}"
          }

          # Was this container created from exactly this image reference —
          # digest identity, not a tag that happens to resolve today.
          replica_runs_image() {
            local cid="$1" want="$2" cfg img
            cfg="$(docker inspect -f '{{.Config.Image}}' "$cid" 2>/dev/null || true)"
            if [ "$cfg" = "$want" ]; then return 0; fi
            img="$(docker inspect -f '{{.Image}}' "$cid" 2>/dev/null || true)"
            if [ -z "$img" ]; then return 1; fi
            docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$img" 2>/dev/null |
              grep -qxF "$want"
          }

          # Every running replica runs $1, and there is at least one.
          all_replicas_run_image() {
            local want="$1" ids seen=0 cid
            ids="$(replica_ids)"
            for cid in $ids; do
              [ "$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || true)" = "running" ] || continue
              seen=$((seen + 1))
              replica_runs_image "$cid" "$want" || { echo "[err] replica $cid does not run $want"; return 1; }
            done
            [ "$seen" -ge 1 ]
          }

          # HTTP probe inside replica index $1 (1-based), path $2.
          probe_replica() {
            timeout 15s docker-compose exec -T --index="$1" "$SERVICE" \
              wget -T 12 -qO- "http://localhost:${SERVICE_PORT}$2" > /dev/null 2>&1
          }

          # Wait until EVERY replica answers $2 (path) within $1 seconds.
          # One healthy replica out of N is a failed deploy, not a deploy.
          await_all_replicas() {
            local budget="$1" path="$2" deadline pending still i
            deadline=$((SECONDS + budget))
            pending="$(seq 1 "$DESIRED_REPLICAS")"
            while [ "$SECONDS" -lt "$deadline" ]; do
              still=""
              for i in $pending; do
                probe_replica "$i" "$path" || still="$still $i"
              done
              pending="$still"
              if [ -z "$(echo $pending)" ]; then return 0; fi
              echo "[info] waiting on $path for replica(s):$pending"
              sleep 5
            done
            return 1
          }
          EOF
          . ./deploy-lib.sh

          # The image is a DIGEST resolved from the manifest CI published
          # after it smoke-tested that exact artifact — never `:latest`,
          # which is a mutable pointer and cannot carry the claim "this is
          # what CI tested".
          #
          # restart/logs skip the verify job, so there is no digest to
          # resolve; those reuse whatever the compose file on disk already
          # pins, which is the last thing this workflow deployed. An empty
          # image after both attempts is fatal — writing a compose file
          # with a blank image would silently resolve to something else.
          # Whatever is pinned right now is what we roll back TO if this
          # deploy fails its own verification. Captured before the compose
          # file is rewritten, because rewriting destroys the only record.
          PREVIOUS_IMAGE=""
          if [ -f docker-compose.yml ]; then
            PREVIOUS_IMAGE="$(awk '/^[[:space:]]+image:/ {print $2; exit}' docker-compose.yml)"
          fi
          echo "PREVIOUS_IMAGE=${PREVIOUS_IMAGE}" >> "$GITHUB_ENV"
          echo "[deploy] currently pinned: ${PREVIOUS_IMAGE:-<nothing>}"

          IMAGE_REF="${IMAGE_FROM_CI}"
          if [ "${ACTION}" = "rollback" ]; then
            # The manual escape hatch, and it must step BACK.
            #
            # It used to read .last-good-image, which after a green
            # release holds the release that just went green — so a
            # rollback prompted by a latent regression re-selected the
            # image already running and then overwrote .previous-image
            # with it, destroying the only reference to the version before
            # (audit F3). The target now comes from the confirmed-good
            # HISTORY (appended on promote, last five kept), and the
            # running digest is excluded by construction.
            if [ ! -s .good-image-history ]; then
              echo "[err] no confirmed-good history on this host — nothing to roll back to."
              echo "[err] Deploy a known-good commit instead, or pin a digest by hand."
              exit 1
            fi
            if [ -n "${IMAGE_INPUT}" ]; then
              # An explicit target still has to be a release that passed
              # both gates on this host.
              if ! grep -qxF "${IMAGE_INPUT}" .good-image-history; then
                echo "[err] '${IMAGE_INPUT}' is not in the confirmed-good history:"
                sed 's/^/[err]   /' .good-image-history
                exit 1
              fi
              IMAGE_REF="${IMAGE_INPUT}"
            else
              # Newest confirmed-good digest that is not the running one.
              IMAGE_REF="$(grep -vxF "${PREVIOUS_IMAGE:-__none__}" .good-image-history | tail -n 1)"
            fi
            if [ -z "$IMAGE_REF" ]; then
              echo "[err] the only confirmed-good image IS the running one (${PREVIOUS_IMAGE:-<nothing>})."
              echo "[err] There is no earlier verified release on this host to step back to."
              exit 1
            fi
            echo "[deploy] ROLLBACK ${PREVIOUS_IMAGE:-<nothing>} -> ${IMAGE_REF}"
          fi
          if [ -z "$IMAGE_REF" ]; then
            IMAGE_REF="$PREVIOUS_IMAGE"
            echo "[deploy] reusing the pinned image already on disk: $IMAGE_REF"
          fi
          if [ -z "$IMAGE_REF" ]; then
            echo "[err] no image to deploy: CI published no digest and no compose file is pinned."
            exit 1
          fi
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "[deploy] image: $IMAGE_REF"

          # Persisted to disk, not just to $GITHUB_ENV, because the
          # promote/rollback decision is made in a LATER job (after the
          # external smoke test, which runs off-box) and job env does not
          # survive that hop.
          #
          # A manual rollback is the exception: .previous-image is then the
          # ONLY reference to the release we are stepping off, and if this
          # rollback is itself bad that reference is the way back. It is
          # staged here and committed after the readiness gate passes.
          if [ "${ACTION}" = "rollback" ]; then
            printf '%s' "$PREVIOUS_IMAGE" > .previous-image.staged
          else
            printf '%s' "$PREVIOUS_IMAGE" > .previous-image
          fi
          printf '%s' "$IMAGE_REF" > .pending-image

          # The deployment transaction: who is mutating this host, what
          # they are putting on it, and what was there before. finalize
          # (a different job, after an off-box smoke test) reads this and
          # refuses to promote or undo anything that is not its own — the
          # state files alone carried no run identity, so a slow finalize
          # could promote a newer run's image as verified (audit F2).
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
            echo "action=${ACTION:-deploy}"
            echo "image=${IMAGE_REF}"
            echo "previous=${PREVIOUS_IMAGE}"
            echo "replicas=${BRAIN_REPLICAS}"
          } > .deploy-txn

          # Brain talks to the SHARED inite-surrealdb container that lives in
          # the temporal stack (inite-temporal/docker-compose). Brain owns
          # NS=brain (separate from gateway's NS=inite); per-tenant DBs are
          # co_<companyId> created on first request via ensureSchema.
          # Migration 0005 creates the brain_caller editor user — first
          # ensureSchema run on a fresh tenant boots it before the scoped
          # pool tries to sign in.
          tee docker-compose.yml > /dev/null << EOF
          services:
            ${PROJECT_NAME}:
              image: ${IMAGE_REF}
              # No container_name: it pins the service to exactly one
              # container and makes \`--scale\` / replicas an error. Compose
              # names the containers <project>-<service>-<n> instead, and
              # Traefik routes to all of them through the labels below.
              deploy:
                replicas: ${BRAIN_REPLICAS:-1}
              restart: unless-stopped
              # PID-1 init (tini): reaps zombie children from the worker
              # pool / native deps and forwards signals so SIGTERM reaches
              # Node cleanly.
              init: true
              # The app's shutdown budget (GracefulShutdownService): 6s
              # readiness drain (/health answers 503, so traefik pulls this
              # replica), then up to 12s for in-flight jobs, then a 25s hard
              # stop. Docker's default 10s SIGKILLs mid-drain.
              stop_grace_period: 30s
              expose:
                - "${PORT}"
              environment:
                - NODE_ENV=production
                - PORT=${PORT}
                - LOG_FORMAT=json
                # Shared SurrealDB — same instance gateway uses.
                # NS=inite (shared namespace; brain's tables knowledge_*
                # don't collide with gateway's). Per-tenant DBs are
                # co_<companyId> created on first request via ensureSchema.
                - SURREALDB_URL=ws://inite-surrealdb:8000
                - SURREALDB_USERNAME=${BRAIN_SURREAL_USER}
                - SURREALDB_PASSWORD=${BRAIN_SURREAL_PASS}
                - SURREALDB_NAMESPACE=inite
                - SURREALDB_POOL_SIZE=8
                - SURREALDB_SCOPED_POOL_SIZE=8
                - SURREALDB_SCOPED_USER=brain_caller
                - SURREALDB_SCOPED_PASS=${BRAIN_SURREAL_SCOPED_PASS}
                # OpenAI for embeddings + extraction + faithfulness verifier.
                - OPENAI_API_KEY=${BRAIN_OPENAI_API_KEY}
                - OPENAI_CHAT_MODEL=gpt-4o-mini-2024-07-18
                # OpenAI client budget — same as eval. Per-stage budgets
                # in search.service.ts (SEARCH_STAGE_BUDGET_MS) cap the
                # end-to-end pipeline regardless of what individual calls
                # take, so we don't need OPENAI_TIMEOUT_MS to be the
                # circuit breaker.
                - OPENAI_TIMEOUT_MS=30000
                - OPENAI_MAX_RETRIES=3
                - OPENAI_CONCURRENCY=8
                # Auth — JWKS via auth.inite.ai. NODE_ENV=production +
                # JWKS enabled ⇒ static BRAIN_API_KEYS is REJECTED, JWT only.
                # The brain-landing admin BFF gets its JWT through the
                # auth-service client_credentials grant — see
                # deploy-brain-landing.yml for OAUTH_CLIENT_ID/SECRET wiring.
                - AUTH_SERVICE_URL=https://auth.inite.ai
                - AUTH_SERVICE_JWKS_URL=https://auth.inite.ai/.well-known/jwks.json
                - AUTH_SERVICE_AUDIENCE=brain
                # Canonical public URL. Two things read it: the RFC 9728
                # discovery document (the `resource` identifier it
                # advertises) and JWKS verification, which accepts this URL
                # and `<url>/mcp` as audiences alongside the vertical name.
                # An MCP client that asks for a token with RFC 8707
                # `resource=` gets `aud = <that URL>`; without this set,
                # the derived audience list is just "brain" and every such
                # token is rejected.
                - BRAIN_PUBLIC_URL=https://brain.inite.ai
                # Exactly one proxy sits in front of this container:
                # Traefik, on the same docker network. Without this, every
                # request arrives from Traefik's address and every
                # anonymous caller in the world shares one rate-limit
                # bucket — the mechanism behind the 2026-09-10 outage,
                # where the health probe and the internet were counted
                # together until the edge pulled the only replica out of
                # rotation. `1` believes exactly the address Traefik
                # appended and nothing a client can set.
                - TRUST_PROXY=1
                # Required: JwksService refuses to boot in production when JWKS
                # is enabled without an issuer (else the \`iss\` claim is not
                # validated). Must match the \`iss\` auth-service signs with —
                # which is the API host (auth-api), NOT the login UI host:
                # https://auth.inite.ai/.well-known/openid-configuration
                # reports issuer=https://auth-api.inite.ai. The old value
                # made brain reject EVERY JWKS-verified token with
                # 'unexpected "iss" claim value' (admin BFF data plane 401).
                - AUTH_SERVICE_ISSUER=https://auth-api.inite.ai
                # GDPR forget HMAC — opaque tombstone marker.
                - FORGET_HMAC_KEY=${BRAIN_FORGET_HMAC_KEY}
                # Search retrieval features — eval-validated ON config.
                # Now safe to keep on because each LLM stage runs under
                # its own withStageBudget wrapper (search.service.ts):
                # router=2s, reranker=4s (parallel SC), cross-encoder=2s,
                # backfill=2s. A stalled LLM fail-opens with the previous
                # stage's result; the request still completes inside the
                # overall pipeline budget instead of stacking 90s × N.
                # Platform refactor 2026-08: SEARCH_RERANKER_ENABLED /
                # SEARCH_HYPE_ENABLED / SEARCH_PREDICATE_ROUTER_ENABLED are
                # deleted keys — the LLM reranker is a capability now (runs
                # because OPENAI_API_KEY is set, bounded by stage budget +
                # SEARCH_RERANK_SKIP_MARGIN); HyPE and the predicate router
                # were removed with their code (never measured to a verdict
                # in the eval program).
                # Retrieval profile (docs/operations.md): prod is the
                # assistant-chat default on every dimension —
                # verbatim=shape_conditioned, dateAnchoring=absolute. The
                # genre tag documents that intent for operators.
                - RETRIEVAL_GENRE=assistant_chat
                - SEARCH_RERANKER_SC_N=3
                # PPR over the candidate subgraph (HippoRAG-style). Auto
                # threshold lowered from 100 → 25 so the typical per-tenant
                # graph (~30-80 candidates) actually triggers it. Hub-effect
                # pathology on truly small graphs is bounded by the edge
                # expansion below capping new buckets — neighbour fan-out
                # was the real source of the 30-entity recall@1 regression
                # in the original PPR rollout.
                - SEARCH_PPR_ENABLED=0
                - SEARCH_PPR_AUTO_THRESHOLD=25
                # Edge-based candidate expansion (always on since the
                # platform refactor folded SEARCH_EDGE_EXPANSION_ENABLED).
                # Top-3 entities by post-bucketing rankScore seed a 1-hop
                # walk over knowledge_edge; neighbours not retrieved by
                # vector/BM25 enter the candidate set with inherited
                # rankScore = α × seed × edge_weight. α=0.4 — inherited
                # score never beats a direct retrieval hit.
                - SEARCH_EDGE_EXPANSION_TOP_SEEDS=3
                - SEARCH_EDGE_EXPANSION_MAX_NEIGHBOURS=5
                - SEARCH_EDGE_EXPANSION_ALPHA=0.4
                # Multi-hop edge expansion: when a hop's combination is
                # subset_of_previous, expand the prior entity set to
                # include 1-hop neighbours over knowledge_edge before
                # anchoring. Turns the chain into a true graph-walk
                # instead of pure set-membership. ON as part of the
                # 2026-09 full-enablement wave (measured null, not
                # negative, in the eval program).
                - MULTI_HOP_EDGE_EXPANSION_ENABLED=1
                # Per-stage budgets (ms). Tunable without redeploy of
                # search.service.ts. Defaults match the constants there;
                # overrides only when prod traffic shape changes.
                - SEARCH_STAGE_BUDGET_ROUTER_MS=2000
                - SEARCH_STAGE_BUDGET_RERANK_MS=4000
                - SEARCH_STAGE_BUDGET_CROSS_ENCODER_MS=2000
                - SEARCH_STAGE_BUDGET_BACKFILL_MS=2000
                # Source-reputation trust at read time (source-reputation phase
                # 5, docs/source-reputation.md). finalScore ×= (1 + β·(trust−0.5))
                # × (1 + γ·min(corroboration, 3)). Turned ON after the quality
                # eval was rerun with the flags set: overall recall@1 0.9466,
                # recall@3 0.9885, MRR 0.9683 (n=262) — within tolerance of the
                # trust-off baseline, delta-gate green. Conservative values:
                # neutral sources (learnedTrust 0.5, no corroboration) stay a
                # ×1.0 no-op, so the effect ramps gracefully as the nightly
                # refit accumulates domain-scoped reputation.
                - SEARCH_TRUST_BETA=0.15
                - SEARCH_CORROBORATION_GAMMA=0.1
                # ── Document pipeline (Source → Indexer → Candidates → Brain,
                # docs/document-pipeline.md) ─────────────────────────────
                # Master switch: POST /v1/ingest/document + the /v1/documents/*
                # surface + the MCP ingest_document tool. Additive endpoints.
                - DOCUMENT_INGEST_ENABLED=1
                # Dedicated per-pack indexer runs + relevance router + the
                # async (queue-driven) fan-out. LLM fan-out is capped by
                # MAX_DEDICATED_INDEXERS_PER_DOC (default 8).
                - DOCUMENT_MULTI_INDEXER_ENABLED=1
                # Route live mention ingestion through the pipeline (response
                # contract preserved). Safe to enable now that the indexer_run
                # reopen/reaper (#142) makes a crashed run recoverable.
                - INGEST_MENTION_VIA_DOCUMENT=1
                # Backfill stored documents with a pack's vocabulary on
                # install/upgrade (bounded by REINDEX_MAX_DOCS_PER_RUN=500).
                - REINDEX_ON_PACK_INSTALL=1
                # ── Marketplace billing (paid domain packs) ─────────────
                # Pull-only entitlement checks against the central billing
                # service (60s TTL cache, fail-closed for PAID packs only —
                # free packs never touch billing). Brain is registered as
                # billing Service code=brain; entitlement key is
                # domain_pack:<packId>, billing userId = brain companyId.
                - DOMAIN_PACK_BILLING_ENABLED=1
                - BILLING_SERVICE_URL=https://billing.inite.ai
                - BILLING_SERVICE_API_KEY=${BRAIN_BILLING_API_KEY}
                # ── MCP pack tools (docs/mcp-pack-tools.md) ─────────────
                # Master ON: consented packs may register declarative QUERY
                # tools (namespace-locked, row-fenced). EXTERNAL proxy tools
                # stay off until a pack actually ships one.
                - MCP_PACK_TOOLS_ENABLED=1
                # Deliberately NOT set (default off): DOCUMENT_ALLOW_UNGROUNDED_
                # EXTERNAL (security opt-in — lets external indexers stage
                # unverifiable spans) and SEARCH_CROSS_ENCODER_LOCAL (prod uses
                # the LLM reranker; no Cohere/cross-encoder configured).
                # ── Hybrid pipeline knobs ────────────────────────────────
                # Chat router (Sprints 1-4.5): cache, embedding hints,
                # collapse cache, intent classification, skip gate.
                - CHAT_ROUTE_CACHE_ENABLED=true
                - CHAT_ROUTE_CACHE_SIZE=2000
                - CHAT_ROUTE_HINT_SIMILARITY=0.4
                - CHAT_ROUTE_HINT_MAX=3
                - CHAT_ROUTE_INTENT_CONFIDENCE_FLOOR=0.85
                - CHAT_ROUTE_NLI_ENABLED=true
                - CHAT_ROUTE_NLI_ASK_THRESHOLD=0.6
                # Extractor (Sprints E1-E7): cache, local predicate select,
                # local NER, learned pattern cache, skip gate.
                - EXTRACTOR_CACHE_ENABLED=true
                - EXTRACTOR_CACHE_SIZE=500
                # text-embedding-3-small + verbose predicate cards rarely
                # hit 0.85 even on semantic match; 0.55 keeps alias
                # precision high while catching the common cases the
                # academic threshold misses ("job_title"→"status",
                # "preferred_food"→"preference").
                - PREDICATE_CANONICALIZE_THRESHOLD=0.55
                - EXTRACTOR_LOCAL_PREDICATE_THRESHOLD=0.45
                # Opt-in: downloads ~135MB ONNX on first ingest. Required
                # for the E7 skip gate to fire.
                - EXTRACTOR_LOCAL_NER_ENABLED=true
                - EXTRACTOR_LOCAL_NER_MIN_SCORE=0.7
                # Opt-in: synthesises ExtractionResult from local clauses
                # + NER + pattern cache when every check passes. Pattern
                # cache populates as LLM extractions land, so the gate
                # starts cold and warms with usage.
                - EXTRACTOR_SKIP_LLM_ENABLED=true
                # Phase 3.C ConU conformal guardrail (synthesize.service).
                # Floor on the isotonic-calibrated confidence below which a
                # fact is not eligible as a citation target — facts above
                # still appear in the search response, just don't ground
                # the generator. 0.30 matches the bitemporal resolver
                # reject_threshold so a fact admitted as INSERTED is also
                # admitted as a citation. Drop to 0 to disable.
                - SYNTHESIZE_MIN_CONFIDENCE=0.30
                # OpenTelemetry GenAI SemConv. When enabled, every
                # gen_ai.chat.* and gen_ai.embed.* span carries the
                # standard semconv attributes (gen_ai.system,
                # gen_ai.request.model, gen_ai.usage.*).
                - OTEL_ENABLED=1
                # OTLP/HTTP receiver in the monitoring stack's Alloy
                # (shared traefik-global network; deploy-monitoring.yml).
                # BASE url only — the SDK exporter appends /v1/traces.
                # Alloy forwards to Tempo; browse in Grafana Explore.
                - OTEL_EXPORTER_OTLP_ENDPOINT=http://inite-monitoring-alloy:4318
                # ── Multilingual embedder (Phase 4.D) ───────────────────
                # BGE-M3 via @xenova/transformers, local CPU inference.
                # 1024-dim multilingual cross-lingual recall vs OpenAI's
                # text-embedding-3-small (1536-dim, English-biased).
                #
                # ROLLOUT MUST follow the reindex playbook:
                #   1. Deploy this commit so the BGE-M3 provider is
                #      preferred. Warmup is now non-blocking (commit
                #      0cde424), so the container goes /health=ok
                #      immediately. Embedding requests refuse incompatible
                #      fallback with 503 until warmup completes. Vector
                #      writes are guarded unconditionally; reads are guarded
                #      by default (EMBEDDING_SPACE_STRICT). A fallback vector
                #      cannot meaningfully query a different model's corpus.
                #   2. /ready reports the PRIMARY embedder only, so it
                #      genuinely goes 200 when the model is warm (it
                #      used to be green from boot because the fallback
                #      counted as ready — which made this step a no-op
                #      and let the reindex below run in the warmup
                #      window). After /ready returns 200, an operator
                #      runs:
                #        curl -X POST -H 'Authorization: Bearer <admin>' \
                #          'https://brain.inite.ai/v1/admin/reindex/embeddings?dryRun=true&allTables=true'
                #      to size the work, then re-runs without dryRun
                #      to write the new vectors per tenant.
                #   3. Reindex is idempotent, but old-space vectors are not
                #      compatible with new queries. Audit all vector columns;
                #      allTables does not yet repair every derived table.
                #
                # Drop to \`openai\` to roll back to text-embedding-3-small.
                - EMBEDDER_PROVIDER=bge-m3
                # Eval baselines live in a system-DB table (#553), not on
                # local disk: a host bind-mount is one replica's disk, so
                # N replicas would each have kept their own history and
                # whichever one answered the request would have shown a
                # different one.
                # ── Phase J/K job queue (Surreal-native) ─────────────────
                # Cron handlers (dreams, compaction, calibration_refit,
                # source_trust_refit) write to job_run as 'pending';
                # WorkerLoopService — gated by the 'worker_loop'
                # leader_lease — claims and dispatches.
                #
                # Queue mode (enqueue), the worker loop and the lease
                # manager are all defaults, so none of them is pinned
                # here. Kill switch: set JOBS_QUEUE_MODE=inline + restart
                # to roll back to the legacy guard.run() inline path
                # without a redeploy. Use when an unexpected backlog
                # accumulates in pending and the worker loop won't
                # drain (handler not registered, lease acquire fails).
                - WORKER_LOOP_POLL_MS=1000
                - WORKER_LOOP_EMPTY_BACKOFF_MS=5000
                - WORKER_LOOP_LEASE_RENEW_MS=30000
                - JOB_RUN_MAX_ATTEMPTS=3
                - JOB_RUN_BACKOFF_BASE_MS=30000
                # CPU-bound dispatcher pool. Disabled (size=0) because
                # no current handler is registered as cpuBound — the
                # scaffolding is there for future heavy jobs (multi-pass
                # extractor offload, batch normalisation). Flip to 2+
                # when a handler opts in via register({ cpuBound: true,
                # workerModule: __dirname + '/X.worker-job.js' }).
                - JOB_WORKER_POOL_SIZE=0
              # Full-enablement feature-flag set (2026-09 wave) — written
              # by the "Write enablement env file" step above. Kept OUT of
              # this heredoc deliberately: the run script contains GitHub
              # expressions, so its whole body counts against the 21k
              # max-expression-length limit, and the ~190-line flag block
              # pushed it over (zero-job "workflow file issue" failure).
              # compose precedence: \`environment:\` above overrides
              # env_file on key collision.
              env_file:
                - ./enablement.env
              volumes:
                # ONNX model cache (TRANSFORMERS_CACHE / HF_HOME /
                # XDG_CACHE_HOME all point at /app/.cache in the image).
                # Shared and read-mostly: without it every replica
                # downloads ~700 MB of BGE-M3 + NER + reranker weights on
                # first boot, against a 300 s readiness gate. The image
                # creates /app/.cache owned by node (uid 1000), so a fresh
                # named volume inherits that ownership and the container's
                # USER node can write it. Concurrent cold starts may fetch
                # the same file twice; the bytes are identical.
                - brain-model-cache:/app/.cache
              labels:
                # ── Backend routes only — landing handles the rest of brain.inite.ai.
                # Backend owns /v1/*, /mcp/*, /health, /registry and the RFC 9728
                # discovery document.
                #
                # /.well-known/oauth-protected-resource is load-bearing, not
                # decoration: every 401 from /mcp/* names it in WWW-Authenticate,
                # and an MCP client that follows the pointer is trying to find
                # the authorization server so it can self-onboard. Without this
                # prefix the request fell through to the landing's catch-all and
                # came back as an HTML 404 — discovery dead-ended silently, and
                # no one-click OAuth connector could ever complete. Only this
                # exact prefix moves: /.well-known/agent-card.json and the rest
                # of that namespace still belong to the landing app.
                # Traefik sorts by rule length so this PathPrefix-restricted
                # router naturally outranks the landing's Host-only catch-all.
                #
                # /openapi.json used to be claimed here and was a 404 the whole
                # time: this service has no route for it, no Swagger module, and
                # the image does not even ship docs/openapi.json — the Dockerfile
                # copies src, dist and package.json, nothing else. Claiming the
                # path only guaranteed the request never reached anything that
                # could answer it. The document is a committed static artifact,
                # so it now falls through to the landing's catch-all and is
                # served out of brain-landing/public alongside /install.sh and
                # /skills.tar.gz, written there by scripts/build-openapi.ts.
                - "traefik.enable=true"
                - "traefik.docker.network=traefik-global"
                - "traefik.http.routers.${PROJECT_NAME}.rule=Host(\`${DOMAIN}\`) && (PathPrefix(\`/v1\`) || PathPrefix(\`/mcp\`) || PathPrefix(\`/health\`) || PathPrefix(\`/ready\`) || PathPrefix(\`/registry\`) || PathPrefix(\`/.well-known/oauth-protected-resource\`))"
                - "traefik.http.routers.${PROJECT_NAME}.priority=200"
                - "traefik.http.routers.${PROJECT_NAME}.entrypoints=websecure"
                - "traefik.http.routers.${PROJECT_NAME}.tls=true"
                - "traefik.http.routers.${PROJECT_NAME}.tls.certresolver=letsencrypt"
                - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=${PORT}"
                - "traefik.http.services.${PROJECT_NAME}.loadbalancer.responseForwarding.flushInterval=-1"
                # Edge rotation, on READINESS. /health answers 200 while the
                # process reports itself degraded (health.controller.ts), so a
                # replica with a broken read path or a cold embedder kept its
                # full share of traffic. /ready is the honest signal: the load
                # balancer takes an unready replica out of rotation and the
                # remaining ones absorb it. With one replica this is also the
                # right answer — an unready pod serving 503 at the edge is what
                # a 503 means — and the deploy gates never let a release reach
                # steady state unready in the first place.
                #
                # The interval is load-bearing for graceful shutdown: SIGTERM
                # flips readiness to 503 and waits ~6s before draining, so one
                # probe (3s interval + 2s timeout) has to land inside that
                # window for the replica to leave rotation before it stops
                # accepting work. Raising it past ~5s reintroduces the
                # connection errors the drain exists to avoid. /health stays
                # the container's liveness probe and answers 503 during
                # shutdown too — do not point Docker's healthcheck here.
                - "traefik.http.services.${PROJECT_NAME}.loadbalancer.healthcheck.path=/ready"
                - "traefik.http.services.${PROJECT_NAME}.loadbalancer.healthcheck.interval=3s"
                - "traefik.http.services.${PROJECT_NAME}.loadbalancer.healthcheck.timeout=2s"
                # http→https redirect for the same backend paths (landing has its own).
                - "traefik.http.routers.${PROJECT_NAME}-http.rule=Host(\`${DOMAIN}\`) && (PathPrefix(\`/v1\`) || PathPrefix(\`/mcp\`) || PathPrefix(\`/health\`) || PathPrefix(\`/ready\`) || PathPrefix(\`/registry\`) || PathPrefix(\`/.well-known/oauth-protected-resource\`))"
                - "traefik.http.routers.${PROJECT_NAME}-http.priority=200"
                - "traefik.http.routers.${PROJECT_NAME}-http.entrypoints=web"
                - "traefik.http.routers.${PROJECT_NAME}-http.middlewares=redirect-to-https"
                - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
                - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost:${PORT}/health"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 30s
              # Resource ceilings: local ONNX (BGE-M3 / NER) + worker pool
              # + LLM fan-out can balloon RSS. Without a cap an unbounded
              # container can OOM the shared host / trip the kernel OOM
              # killer mid-job. Raised 2g -> 4g for the enablement wave:
              # SEARCH_FACT_RERANK / SEGMENT_LANE_RERANK / NOISE_FILTER
              # lazily load the local cross-encoder worker (~280MB
              # bge-reranker-base) on top of BGE-M3 + NER.
              mem_limit: 4g
              mem_reservation: 1536m
              cpus: 2.0
              pids_limit: 512
              networks:
                - traefik-global
                - default

          volumes:
            brain-model-cache:

          networks:
            traefik-global:
              external: true
          EOF

          if [ "${ACTION}" = "restart" ]; then
            echo "[deploy] restart only"
            docker-compose restart "${PROJECT_NAME}"
          else
            echo "[deploy] pulling image..."
            docker-compose pull "${PROJECT_NAME}"
            echo "[deploy] up -d (${BRAIN_REPLICAS} replica(s))"
            # --scale as well as deploy.replicas: the replicas key is
            # honoured by compose v2 and ignored by v1, the flag by both.
            docker-compose up -d --remove-orphans --scale "${PROJECT_NAME}=${BRAIN_REPLICAS}"
          fi

          # Wait for the FULL desired count, not for "something is up".
          up=0
          for i in $(seq 1 12); do
            up="$(running_replicas)"
            [ "$up" -ge "${BRAIN_REPLICAS}" ] && break
            sleep 5
          done
          if [ "$up" -ge "${BRAIN_REPLICAS}" ]; then
            echo "[ok] ${up}/${BRAIN_REPLICAS} replicas of ${DOMAIN} are up"
          else
            echo "[err] only ${up}/${BRAIN_REPLICAS} replicas started"
            docker-compose ps
            docker-compose logs --tail=100 "${PROJECT_NAME}"
            exit 1
          fi

          # Identity check: the containers actually running must be THIS
          # run's image. Anything else means another run has replaced them
          # underneath us, and every gate below would be measuring
          # somebody else's release.
          if ! all_replicas_run_image "${IMAGE_REF}"; then
            echo "[err] running replicas are not ${IMAGE_REF} — another run replaced them mid-deploy"
            docker-compose ps
            exit 1
          fi
          echo "[ok] every running replica is ${IMAGE_REF}"

      - name: Internal health probe
        if: github.event.inputs.action != 'logs'
        run: |
          cd "${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}"
          . ./deploy-lib.sh
          # Internal probe via docker exec — bypasses DNS / Traefik /
          # cert provisioning. This is the gate signal: did brain itself
          # boot and respond, on EVERY replica. External reachability is
          # checked by the smoke job so a missing DNS record or a slow
          # Let's Encrypt cert doesn't fail an otherwise-healthy deploy.
          if await_all_replicas 90 /health; then
            echo "[ok] all ${DESIRED_REPLICAS} replica(s) respond on /health"
            docker-compose exec -T --index=1 "${PROJECT_NAME}" \
              wget -qO- "http://localhost:${PORT}/health" | head -c 500 || true
            echo ""
            exit 0
          fi
          echo "[err] internal health never responded on every replica"
          docker-compose ps
          docker-compose logs --tail=120 "${PROJECT_NAME}"
          exit 1

      - name: Internal readiness gate
        if: github.event.inputs.action != 'logs'
        run: |
          cd "${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}"
          . ./deploy-lib.sh
          # /health (gate above) is liveness — green as soon as Nest boots,
          # while the primary embedder is warming. A live process with broken
          # reads is not a successful deploy. Every replica has to clear it:
          # Traefik balances over all of them, so one unready replica is a
          # fraction of production serving 503s. Five minutes for cold boot
          # (the model cache volume is what keeps that budget realistic once
          # replicas share it); each probe is bounded as well as the window.
          if await_all_replicas 300 /ready; then
            echo "[ok] all ${DESIRED_REPLICAS} replica(s) READY (db + scoped authorization + primary embedder)"
            exit 0
          fi
          echo "[err] /ready never went green on every replica within the readiness window."
          echo "[err] Inspect scoped DB credentials and primary embedder warmup logs; do not start reindex until /ready is 200."
          docker-compose ps
          exit 1

      # A manual rollback's `.previous-image` was staged, not written: the
      # release we stepped off is the way back if the rollback is itself
      # bad, and overwriting the pointer before this gate passed destroyed
      # it (audit F3). The gate above passed, so commit it — and drop the
      # rejected digest from the confirmed-good history so the NEXT
      # rollback steps further back instead of returning to it.
      - name: Commit the rollback pointers
        if: github.event.inputs.action == 'rollback'
        run: |
          cd "${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}"
          [ -s .previous-image.staged ] || { echo "[rollback] nothing staged"; exit 0; }
          REJECTED="$(cat .previous-image.staged)"
          mv .previous-image.staged .previous-image
          if [ -n "$REJECTED" ] && [ -s .good-image-history ]; then
            grep -vxF "$REJECTED" .good-image-history > .good-image-history.next || true
            mv .good-image-history.next .good-image-history
          fi
          echo "[rollback] previous-image is now ${REJECTED}; dropped it from the confirmed-good history"

      # The external check moved OUT of this job and into `smoke` below.
      # It used to be `curl -fs .../health`, warning-only — which verified
      # that Nest had bound a port and nothing else, and could not fail a
      # deploy even when it did notice something. Liveness is already
      # covered by the two internal gates above; what was missing was any
      # assertion about the surface actually being served.

      - name: Cleanup
        if: always() && github.event.inputs.action != 'logs'
        run: docker system prune -f

  # ---------------------------------------------------------------------
  # Post-deploy smoke test of the real surface, off-box and through
  # Traefik — so it exercises DNS, the certificate, the router rules and
  # the container, which is the whole path a caller uses.
  #
  # It asserts behaviour a dead or misrouted deploy cannot fake: an
  # unauthenticated POST to /v1/search must come back 401. A 404 means the
  # API is not mounted; a 200 means auth is not enforced. Only 401 says
  # the surface is there and fail-closed. See scripts/ci/smoke.mjs.
  #
  # This job BLOCKS. Its failure is what triggers the rollback below.
  # ---------------------------------------------------------------------
  smoke:
    needs: deploy
    if: needs.deploy.result == 'success' && github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke the deployed surface
        env:
          SMOKE_BASE_URL: https://${{ env.DOMAIN }}
          SMOKE_SURFACE: brain
        run: node scripts/ci/smoke.mjs

  # ---------------------------------------------------------------------
  # Promote or roll back, depending on what the verification said.
  #
  # There was previously no way back at all: a failed probe dumped logs,
  # exited 1, and left the broken container running. The SHA-tagged image
  # the old build pushed was referenced by nothing, so even a manual
  # rollback meant hand-editing the compose file on the box.
  #
  # `.last-good-image` and `.good-image-history` are written ONLY here,
  # only after both the readiness gate and the external smoke passed — so
  # they hold known-good targets rather than merely previous ones.
  #
  # Every step below first checks that the deployment transaction on the
  # box is still THIS run's. The smoke job runs off-box, so minutes pass
  # between `deploy` and here, and the state files carried no run
  # identity: run A's finalize would happily promote the image run B had
  # just written into `.pending-image`, declaring an unverified release
  # good (audit F2). A superseded finalize now exits 0 and touches
  # nothing — the run that owns the transaction is the one that resolves
  # it.
  # ---------------------------------------------------------------------
  finalize:
    needs: [deploy, smoke]
    if: always() && github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
    runs-on: [self-hosted, sfo]
    timeout-minutes: 15
    steps:
      - name: Read the deployment transaction
        id: txn
        run: |
          set -uo pipefail
          cd "${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}" || { echo "ours=0" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ ! -s .deploy-txn ]; then
            echo "[txn] no transaction recorded on this host — nothing to resolve"
            echo "ours=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TXN_RUN="$(sed -n 's/^run_id=//p' .deploy-txn)"
          TXN_IMAGE="$(sed -n 's/^image=//p' .deploy-txn)"
          TXN_PREVIOUS="$(sed -n 's/^previous=//p' .deploy-txn)"
          if [ "$TXN_RUN" != "${GITHUB_RUN_ID}" ]; then
            echo "[txn] superseded by run ${TXN_RUN}, not touching state (this run is ${GITHUB_RUN_ID})"
            echo "ours=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "ours=1"
            echo "image=${TXN_IMAGE}"
            echo "previous=${TXN_PREVIOUS}"
          } >> "$GITHUB_OUTPUT"
          echo "[txn] run ${TXN_RUN} owns this host: image=${TXN_IMAGE} previous=${TXN_PREVIOUS:-<nothing>}"

      - name: Promote this image to last-known-good
        if: needs.deploy.result == 'success' && needs.smoke.result == 'success' && steps.txn.outputs.ours == '1'
        env:
          TXN_IMAGE: ${{ steps.txn.outputs.image }}
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}"
          . ./deploy-lib.sh
          if [ ! -s .pending-image ]; then
            echo "[promote] nothing pending — leaving the confirmed-good history untouched"
            exit 0
          fi
          PENDING="$(cat .pending-image)"
          if [ "$PENDING" != "$TXN_IMAGE" ]; then
            echo "[promote] .pending-image (${PENDING}) is not this run's image (${TXN_IMAGE}) — superseded, not touching state"
            exit 0
          fi
          # And the thing running has to BE it: smoke passed against the
          # domain, which is only evidence about this release if this
          # release is what the replicas are serving.
          if ! all_replicas_run_image "$TXN_IMAGE"; then
            echo "[promote] running replicas are not ${TXN_IMAGE} — superseded, not touching state"
            exit 0
          fi
          printf '%s' "$TXN_IMAGE" > .last-good-image
          # Confirmed-good history, oldest first, last five kept. A digest
          # already in it is left where it is, so the order stays "when it
          # was first confirmed" and a rollback cannot ping-pong.
          touch .good-image-history
          if ! grep -qxF "$TXN_IMAGE" .good-image-history; then
            echo "$TXN_IMAGE" >> .good-image-history
            tail -n 5 .good-image-history > .good-image-history.next
            mv .good-image-history.next .good-image-history
          fi
          echo "[promote] last known-good is now ${TXN_IMAGE}; history:"
          sed 's/^/[promote]   /' .good-image-history

      # Deliberately NOT `!= 'success'`. When `verify` fails — a red CI, no
      # manifest — `deploy` is *skipped*, which is also not 'success', and
      # rolling back then would restart production over a deploy that never
      # happened. Nothing was touched, so nothing needs undoing. Only a
      # deploy that actually ran and went wrong, or a smoke test that
      # actually failed, is a reason to move the running image.
      - name: Roll back to the previous image
        if: (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled' || needs.smoke.result == 'failure') && steps.txn.outputs.ours == '1'
        env:
          TXN_IMAGE: ${{ steps.txn.outputs.image }}
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}"
          . ./deploy-lib.sh

          CURRENT="$(awk '/^[[:space:]]+image:/ {print $2; exit}' docker-compose.yml || true)"
          # Undo THIS run's deploy, or nothing. If the pinned image is no
          # longer the one this run put there, a later run has already
          # moved production and restarting into our idea of "previous"
          # would roll that newer release back behind its back.
          if [ -n "$TXN_IMAGE" ] && [ "$CURRENT" != "$TXN_IMAGE" ]; then
            echo "[rollback] pinned image (${CURRENT}) is not this run's (${TXN_IMAGE}) — superseded, not touching state"
            exit 0
          fi

          # Prefer the last image that passed BOTH gates over merely "the
          # one that was pinned before this run" — if the previous deploy
          # was itself broken, rolling back to it achieves nothing.
          TARGET=""
          if [ -s .last-good-image ]; then
            TARGET="$(cat .last-good-image)"
          elif [ -s .previous-image ]; then
            TARGET="$(cat .previous-image)"
          fi

          if [ -z "$TARGET" ]; then
            echo "[rollback] no known-good or previous image recorded on this host."
            echo "[rollback] The broken deploy is still running and MUST be handled by hand:"
            echo "[rollback]   pin a digest in ${PROJECT_DIR:-/opt/projects/${PROJECT_NAME}}/docker-compose.yml"
            echo "[rollback]   then: docker-compose up -d"
            exit 1
          fi

          if [ "$TARGET" = "$CURRENT" ]; then
            echo "[rollback] already running $TARGET — the failure is not the image."
            echo "[rollback] Not restarting into the same thing. Investigate the deploy logs."
            exit 1
          fi

          echo "[rollback] $CURRENT -> $TARGET"
          sed -i "s|^\([[:space:]]*image:\).*|\1 ${TARGET}|" docker-compose.yml
          docker-compose pull "${PROJECT_NAME}"
          docker-compose up -d --remove-orphans --scale "${PROJECT_NAME}=${DESIRED_REPLICAS}"

          # A rollback that is not itself verified is just a second
          # unverified deploy — and one ready replica out of N is not a
          # verified rollback either.
          if await_all_replicas 300 /ready; then
            echo "[rollback] $TARGET is READY on all ${DESIRED_REPLICAS} replica(s). Production is back on the last known-good image."
            echo "[rollback] The commit that failed is still on main — fix forward or revert it."
            exit 1
          fi
          echo "[rollback] FAILED — the rolled-back image did not become ready either."
          docker-compose ps
          docker-compose logs --tail=120 "${PROJECT_NAME}"
          exit 1
