name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # A change to prose alone has nothing for CodeQL to analyse. main (on
    # push) and the weekly run still scan the whole tree, so nothing that
    # merges goes unscanned. Not a required check, so a skipped PR run
    # blocks nothing.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'packs/**'
      - 'models/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'CHANGELOG.md'
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

# Workflow-level least privilege; the analyze job below elevates to the
# security-events: write it needs to upload results.
permissions:
  contents: read

# A new commit on a PR supersedes the PR's analysis in flight. main is never
# cancelled: its result is the baseline every PR alert is compared against.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:javascript-typescript'
