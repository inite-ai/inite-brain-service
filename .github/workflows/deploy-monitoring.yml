name: Deploy monitoring

# Self-hosted observability stack (VictoriaMetrics + Loki + Tempo +
# Alloy + Grafana) — see monitoring/README.md. Runs on the droplet's
# own runner, same pattern as deploy-brain.yml: no SSH, just rsync the
# checked-out monitoring/ dir into the stack path and compose up.

# PRODUCTION MOVES ON A RELEASE, NOT ON A MERGE (family standard, 29.10.2026;
# inite-shared/.planning/family-standards-2026-10.md), like the engine
# (deploy-brain.yml). release-please.yml calls this workflow in the run that
# cut the release (a release made with GITHUB_TOKEN starts no `release`
# workflow); `release: published` is for a release a person publishes. The
# `changes` job keeps the old path filter, measured against the previous
# release. `workflow_dispatch` deploys, restarts or shows logs by hand.
on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | restart | logs'
        required: false
        default: 'deploy'

# One monitoring deploy at a time, queued; never cancelled halfway.
concurrency:
  group: deploy-monitoring
  cancel-in-progress: false

env:
  STACK_DIR: /opt/projects/inite-monitoring

# Least-privilege default token: checkout only; deploy runs on a self-hosted
# runner via rsync + compose.
permissions:
  contents: read

jobs:
  # Only a commit main took through a green ci (or a released tag) goes out.
  gate:
    uses: inite-ai/inite-shared/.github/workflows/release-gate.yml@main
    permissions:
      contents: read
      checks: read
      pull-requests: read

  # What changed since the previous release (it is what production runs):
  # the same paths that used to trigger this workflow on a push, monitoring/ and this workflow.
  changes:
    runs-on: ubuntu-latest
    outputs:
      monitoring: ${{ steps.diff.outputs.monitoring }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Paths changed since the previous release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # The newest published release behind this commit (not this commit
          # itself); without one, everything counts as changed.
          base=""
          for tag in $(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName'); do
            git fetch -q origin "refs/tags/$tag:refs/tags/$tag" || continue
            c=$(git rev-list -n 1 "$tag")
            if [ "$c" != "$SHA" ] && git merge-base --is-ancestor "$c" "$SHA"; then base="$c"; break; fi
          done
          if [ -z "$base" ]; then
            echo "no previous release behind ${SHA:0:8}: deploying"
            echo "monitoring=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$SHA" | grep -E '^(monitoring/|\.github/workflows/deploy-monitoring\.yml$)' || true)
          echo "since ${base:0:8}:"; echo "${changed:-  (nothing for this lane)}"
          if [ -n "$changed" ]; then echo "monitoring=true"; else echo "monitoring=false"; fi >> "$GITHUB_OUTPUT"

  deploy:
    needs: [gate, changes]
    # A release deploys when monitoring/ changed; a dispatch always runs, and
    # restart and logs need no green gate (they ship nothing new).
    if: |
      always() && (
        (github.event_name != 'workflow_dispatch' && needs.gate.result == 'success' && needs.changes.outputs.monitoring == 'true') ||
        (github.event_name == 'workflow_dispatch' && (needs.gate.result == 'success' || github.event.inputs.action == 'restart' || github.event.inputs.action == 'logs'))
      )
    runs-on: [self-hosted, sfo]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Logs
        if: github.event.inputs.action == 'logs'
        run: |
          cd "$STACK_DIR"
          docker-compose logs --tail=200

      - name: Restart
        if: github.event.inputs.action == 'restart'
        run: |
          cd "$STACK_DIR"
          docker-compose restart

      - name: Preflight — host memory headroom
        if: github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
        run: |
          free -m
          avail=$(free -m | awk '/^Mem:/{print $7}')
          if [ "$avail" -lt 1200 ]; then
            echo "::warning::Only ${avail}MB RAM available — the monitoring stack is capped at 1GB; watch for OOM pressure"
          fi
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}' | head -20 || true
          docker ps --format 'table {{.Names}}\t{{.Image}}' || true

      - name: Sync stack config
        if: github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
        run: |
          mkdir -p "$STACK_DIR"
          rsync -a --delete --exclude '.env' monitoring/ "$STACK_DIR"/

      - name: Write .env (secrets → compose)
        if: github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
            echo "::error::GRAFANA_ADMIN_PASSWORD secret is not set"
            exit 1
          fi
          umask 077
          {
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
          } > "$STACK_DIR/.env"
          # Telegram contact point is provisioned only when both secrets
          # exist — an empty $-expansion would brick the contact point.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            cp "$STACK_DIR/grafana/alerting-optional/telegram.yaml" \
               "$STACK_DIR/grafana/provisioning/alerting/telegram.yaml"
            echo "[ok] telegram alerting provisioned"
          else
            echo "[info] TELEGRAM_* secrets unset — alerts visible in Grafana UI only"
          fi

      - name: Deploy
        if: github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
        run: |
          cd "$STACK_DIR"
          docker-compose pull
          docker-compose up -d --remove-orphans

      # Grafana reads provisioning/alerting/*.yaml at STARTUP only. The step
      # above copies the rule files onto a bind mount, and `up -d` is a no-op
      # for a container whose image and config are unchanged — so an edited
      # alert rule was copied to the host and never loaded. The deploy went
      # green while Grafana kept serving the previous ruleset, which is the
      # worst possible shape for a monitoring change: it looks applied.
      #
      # Restarting grafana is the fix chosen here. It is cheap (seconds) and
      # alert state and silences live in its own database and survive. The
      # alternative — POST /api/admin/provisioning/alerting/reload — would
      # avoid the few seconds of evaluation gap and the credential IS at hand
      # (GRAFANA_ADMIN_PASSWORD is written to .env above); a restart is kept
      # because it also picks up dashboard and datasource provisioning in one
      # step, and needs no reachable API port from the runner.
      - name: Reload Grafana provisioning (alert rules load at startup only)
        if: github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
        run: |
          cd "$STACK_DIR"
          docker-compose restart grafana
          # Confirm it came back before the health probe attributes an
          # unrelated failure to the restart.
          for i in $(seq 1 30); do
            if docker-compose exec -T grafana wget -qO- http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "[ok] grafana back after provisioning reload"; exit 0
            fi
            sleep 2
          done
          echo "[error] grafana did not come back within 60s of the provisioning reload"; exit 1

      - name: Health probe
        if: github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
        run: |
          cd "$STACK_DIR"
          # VM has no shell (scratch image) — probe it through grafana's
          # busybox wget over the shared monitoring network. Grafana's
          # public URL is probed from the host through Traefik.
          for i in $(seq 1 12); do
            ok=1
            docker-compose exec -T grafana wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || ok=0
            docker-compose exec -T grafana wget -qO- http://victoriametrics:8428/health >/dev/null 2>&1 || ok=0
            curl -fsS https://brain.inite.ai/grafana/api/health >/dev/null 2>&1 || ok=0
            if [ "$ok" = 1 ]; then
              echo "[ok] grafana + victoriametrics healthy, public route live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::monitoring stack failed health probe"
          docker-compose ps
          docker-compose logs --tail=50
          exit 1

  # From outside the host (family verify-deploy): Grafana answers on its
  # public route.
  verify:
    needs: deploy
    if: needs.deploy.result == 'success' && github.event.inputs.action != 'logs' && github.event.inputs.action != 'restart'
    uses: inite-ai/inite-shared/.github/workflows/verify-deploy.yml@main
    with:
      urls: https://brain.inite.ai/grafana/api/health
