name: Release image

# Build and push a versioned Docker image — :vX.Y.Z, :X.Y, and :latest — so
# releases map to immutable images instead of only :latest from the rolling
# main deploy.
#
# Triggers:
#   * workflow_call  — invoked by release-please.yml when it cuts a release
#     (the tag it pushes uses GITHUB_TOKEN, which by design cannot trigger a
#     `push: tags` workflow, so this is the path that actually fires).
#   * workflow_dispatch — build a specific tag on demand.
#   * push: tags — still fires if a human (non-GITHUB_TOKEN) pushes a v* tag.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.5.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.5.0)'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag ref when invoked by release-please / dispatch; the pushed
          # tag otherwise.
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service
          # `value=` derives the version from the input tag when this runs off
          # a non-tag ref (workflow_call from the main-branch release run);
          # it falls back to the pushed tag name for the push trigger.
          tags: |
            type=semver,pattern=v{{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-brain-service:buildcache
