name: Devcontainer

# Builds .devcontainer/ (the "Open in Codespaces" environment) and runs one
# quick command inside it, so a broken devcontainer fails on the PR that
# broke it instead of on the next contributor's first click. Build only —
# nothing is pushed. Runs only when the files that shape the environment
# change.
on:
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the devcontainer and run a smoke command in it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          # Toolchain present, deps installed by post-create, .env seeded,
          # SurrealDB reachable on localhost, and the repo's format gate runs.
          runCmd: |
            set -e
            node --version
            pnpm --version
            test -f .env
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/health
            pnpm format:check
