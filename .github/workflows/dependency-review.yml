name: Dependency review

on:
  pull_request:
    # The review diffs manifests and lockfiles; a PR touching none of them
    # has nothing to review. Not a required check.
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/package-lock.json'
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action needs a public repo (or GitHub Advanced Security). Skip on
    # private so PRs aren't blocked red until the repo is public.
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
