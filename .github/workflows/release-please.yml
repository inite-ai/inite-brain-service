name: release-please

on:
  push:
    branches: [main]

# Least-privilege default token; only the release-please job below is
# elevated to the write scopes it needs to open the release PR and cut the
# release commit/tag. The `image` job calls a reusable workflow that does its
# own Docker Hub auth and needs no more than the inherited contents: read.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the immutable versioned image in the SAME workflow run — the tag
  # release-please pushes uses GITHUB_TOKEN and can't trigger release-image's
  # own `push: tags`, so wire it here instead.
  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
